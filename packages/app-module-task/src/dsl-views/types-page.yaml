# Task types (nav /types), stored in each project's .task/config.yml. With no type configured any text is accepted for
# the type of a task; as soon as one is configured the type of a task must be one of them.
# With ?project=<absolute dir> (optional when a single project is registered): the types of that project, which can be
# added to and removed. WITHOUT ?project and with several projects registered: the types of every project side by side
# (Project column, a row click opens that project). Adding is possible there too, to the project picked in the form (none
# preselected, unreadable ones are not offered); removing is not: the types to choose from depend on the project, which a
# form cannot cascade, so it stays on the page of one project.
# One `types` source for every scope, fed by `scopeQuery` (see tasks-page.yaml).
# A header with actions shows no subtitle: the project is named by `projectText` below it.
# Forms submit through named actions (see task-page.yaml for the conventions: projectParam, inline errors, reload).
# inlineErrors on every source: one failing source discards the answers of all the others (the page stays blank), so a
# failure is answered as data (`errorText`) and shown by a badge.
$sources:
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $urlParam.project
    types:
        url: GET /api/modules/task/types?{query}&inlineErrors=true
        params:
            query: $source.projects.scopeQuery
            reload: $urlParam.reload

$actions:
    addType:
        url: POST /api/modules/task/types?project={projectParam}&inlineErrors=true
        resultKey: typeResult
        reloadSources: true
    # {name} is the encoded type picked in the select.
    removeType:
        url: DELETE /api/modules/task/types/{name}?project={projectParam}&inlineErrors=true
        resultKey: typeResult
        reloadSources: true

$type: PageContent
sections:
    - $type: PageHeader
      title: Types
      headerActions:
          - $type: ButtonLink
            $if: $sources.projects.globalHrefs.types
            label: All projects
            to: $sources.projects.globalHrefs.types
    # Nothing registered yet: the welcome text of the route (the exact next step) instead of a blank page.
    - $type: Badge
      $if: $sources.projects.noProjects
      label: $sources.projects.noProjectsText
      variant: info
    - $type: Badge
      $if: $sources.projects.selectedProblem
      label: $sources.projects.selectedProblem
      variant: danger
    - $type: Badge
      $if: $sources.types.projectText
      label: $sources.types.projectText
      variant: info
    # ?project=... names a directory the registry does not know: said, with the way back, not a blank page.
    - $type: Badge
      $if: $sources.projects.unknownProjectText
      label: $sources.projects.unknownProjectText
      variant: danger
    - $type: Badge
      $if: $sources.types.errorText
      label: $sources.types.errorText
      variant: danger
    - $type: Badge
      $if: $ctx.typeResult.errorText
      label: $ctx.typeResult.errorText
      variant: danger
    - $type: Badge
      $if: $sources.types.restricted
      label: Task types are restricted to this list.
      variant: info
    # All projects: what it covers and the projects it could not read (never dropped).
    - $type: Badge
      $if: $sources.types.scopeText
      label: $sources.types.scopeText
      variant: info
    - $type: Badge
      $if: $sources.types.warning
      label: $sources.types.warning
      variant: warning
    - $type: DataTable
      $if: $sources.types.scopeText
      rows: $sources.types.rows
      navigateTo: '{href}'
      emptyMessage: No project to show
      columns:
          - { key: 'projectName', label: 'Project' }
          - { key: 'typeText', label: 'Type' }
    - $type: DataTable
      $if: $sources.types.project
      rows: $sources.types.rows
      emptyMessage: No type configured, any text is accepted for the type of a task
      columns:
          - { key: 'name', label: 'Type' }
    - $type: Form
      $if: $sources.types.forms
      onSubmit: $ctx.addType
      initialData: $sources.types.forms.add
      fields:
          # Only in the global scope: the project the type is added to is picked here, never guessed.
          - $type: FieldSelect
            $if: $sources.types.projectOptions
            label: Project
            bind: projectParam
            options: $sources.types.projectOptions
            placeholder: Choose a project
          - $type: FieldText
            label: New type
            bind: name
      actions:
          - $type: ButtonSave
            label: Add type
    - $type: Form
      $if: $sources.types.restricted
      onSubmit: $ctx.removeType
      initialData: $sources.types.forms.remove
      fields:
          - $type: FieldSelect
            label: Type to remove
            bind: name
            options: $sources.types.removeOptions
            # Without it the select shows its first type while the form holds none: picking it (the only one,
            # typically) was no change, so the button stayed off.
            placeholder: Choose a type
      actions:
          - $type: ButtonSave
            label: Remove type
