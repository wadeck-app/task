# Dashboard widget, global view: open and total tasks over every registered project, then one row per project.
# No ?project: the route aggregates every registered project (task-service summarizeProjects). Nothing registered is
# an info text with the next step (not an error); a project that cannot be read is a row with its reason, never dropped.
# The row click opens the Tasks page of the project. The status table is in the API (`rows`) but not here: the widget is narrow.
# Sized in manifest.json (width 3 = about 332px on the 100px grid). The two figure tiles share the tile width (itemSizes). Figure
# labels are one word and the project column is cut by the route (WIDGET_LABEL_MAX) and truncates with an ellipsis, full name or reason
# in the tooltip, so nothing breaks mid-word (a DataTable cell without nowrap/truncate is break-all, which split names at 2 and 3 cells).
$sources:
    summary:
        url: GET /api/modules/task/summary?inlineErrors=true

$type: VerticalStack
gap: gap-3
items:
    # Every registered project failed (or the shared registry cannot be read): the reason and the fix (inlineErrors: a failed source blanks the widget).
    - $type: Badge
      $if: $sources.summary.errorText
      label: $sources.summary.errorText
      variant: danger
    # Nothing registered yet: the welcome text of the route (the exact next step), no empty tile nor table.
    - $type: Badge
      $if: $sources.summary.noProjects
      label: $sources.summary.noProjectsText
      variant: info
    # Projects the route could not read are not counted: say so instead of showing an undercount.
    # Short text (the badge of the narrow widget does not wrap); the table below names the gist (the full reasons are on the Projects page).
    - $type: Badge
      $if: $sources.summary.skippedCount
      label: $sources.summary.skippedText
      variant: warning
    # The shared registry could not be read: no project is counted, this says why.
    - $type: Badge
      $if: $sources.summary.registryProblem
      label: $sources.summary.registryProblem
      variant: danger
    # The figures only when a project was counted: after a failure or with nothing registered the badge above is the whole answer.
    - $type: HorizontalStack
      gap: gap-3
      # `flex` per tile: each takes an equal share of the tile width (without it a tile keeps its own ~70px and the right half stays empty).
      itemSizes: [flex, flex]
      $if: $sources.summary.projectCount
      items:
          - $type: StatTile
            label: Open
            value: $sources.summary.open
          - $type: StatTile
            label: All
            value: $sources.summary.total
    - $type: DataTable
      $if: $sources.summary.projectCount
      rows: $sources.summary.projectRows
      navigateTo: '{href}'
      columns:
          - { key: 'label', label: 'Project', nowrap: true, truncate: true, title: '{labelTitle}' }
          - { key: 'openText', label: 'Open', nowrap: true }
          - { key: 'totalText', label: 'Total', nowrap: true }
