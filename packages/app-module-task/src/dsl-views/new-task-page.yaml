# Create a task (route /new). The project comes from ?project=; with several projects registered and none given the form
# asks for it in a select (readable projects only, none preselected unless exactly one is readable). The parent list is
# the open tasks of the project given in the URL: a project picked in the form cannot feed it (a form cannot cascade), so
# it appears only when the page was opened for a project.
# Submits through a named action (conventions of task-page.yaml: projectParam, inline errors, reload);
# the answer is published as $ctx.created: message, link to the new task, the queue events that were not delivered,
# or the error (errorText).
# The `tasks` source is fed by `projectQuery`: the project, else `blank=true` (an empty answer that replaces the
# parent list of a previous project instead of leaving it on screen).
# inlineErrors on every source: one failing source discards the answers of all the others (the page stays blank), so a
# failure is answered as data (`errorText`) and shown by a badge.
$sources:
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $urlParam.project
    tasks:
        url: GET /api/modules/task/tasks?{query}&inlineErrors=true
        params:
            query: $source.projects.projectQuery
            reload: $urlParam.reload

$actions:
    createTask:
        url: POST /api/modules/task/tasks?project={projectParam}&inlineErrors=true
        resultKey: created
        reloadSources: true

$type: PageContent
sections:
    - $type: PageHeader
      title: New task
    - $type: BackLink
      $if: $sources.projects.tasksHref
      to: $sources.projects.tasksHref
      label: Back to the tasks
    - $type: BackLink
      $if: $sources.projects.allProjectsHref
      to: $sources.projects.allProjectsHref
      label: All projects
    - $type: Badge
      $if: $sources.projects.selectedText
      label: $sources.projects.selectedText
      variant: info
    # Nothing registered yet: the welcome text of the route (the exact next step) instead of a blank page.
    - $type: Badge
      $if: $sources.projects.noProjects
      label: $sources.projects.noProjectsText
      variant: info
    - $type: Badge
      $if: $sources.projects.selectedProblem
      label: $sources.projects.selectedProblem
      variant: danger
    - $type: Badge
      $if: $sources.tasks.errorText
      label: $sources.tasks.errorText
      variant: danger
    - $type: Badge
      $if: $ctx.created.errorText
      label: $ctx.created.errorText
      variant: danger
    - $type: Badge
      $if: $ctx.created.message
      label: $ctx.created.message
      variant: success
    - $type: Badge
      $if: $ctx.created.undeliveredText
      label: $ctx.created.undeliveredText
      variant: warning
    - $type: ButtonLink
      $if: $ctx.created.href
      label: Open the new task
      to: $ctx.created.href
    - $type: Form
      $if: $sources.projects.forms
      onSubmit: $ctx.createTask
      initialData: $sources.projects.forms.create
      fields:
          - $type: FieldSelect
            $if: $sources.projects.needsSelection
            label: Project
            bind: projectParam
            options: $sources.projects.projectOptions
            placeholder: Choose a project
          - $type: FieldTextarea
            label: Description
            bind: description
          - $type: FieldSelect
            $if: $sources.tasks.parentOptions
            label: Parent (optional)
            bind: parent
            options: $sources.tasks.parentOptions
            placeholder: No parent
      actions:
          - $type: ButtonSave
            label: Create task
