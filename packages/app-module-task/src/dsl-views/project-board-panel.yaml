# Contribution to project:project-panels (the project module, page of one project): the Kanban board of THAT project.
# Host context: $route.project = the project reference of the host page (the registry id). A contribution cannot declare
# $sources or $actions (ignored), so the component fetches its own data: it reads `boardPath?project=<projectParam>` itself, watches
# `eventsPath` for changes and, on a move, POSTs `movePath` (default /tasks/{id}/status below apiBase) by itself, showing the
# failure inside the board. Its A/B rows are in the shell's shared dock (app-core --ab-tests). The root must be a Section
# (accepted by the slot; children are not checked).
$type: Section
title: Board
$if: $route.project
items:
    - $type: task:KanbanBoard
      projectParam: $route.project
