# The LOCALIZED options of the task page: one dsl-ui AbTest per element that can be improved, each with 2 options and the best
# one first (`initial`, the only one a production shell renders). Seven rows at most in the dock. An AbTest that changes two
# places of the page (the sub-task add, the link add) is repeated with the SAME declaration (id, label, initial, option
# labels and hints): the dock then shows one row and one choice, and each place gets its own view.
#
#   description-style   card with a header strip | plain heading
#   subtask-add         last row of the list    | popup with icons
#   subtask-list        checklist               | compact table
#   link-add            last row of the panel   | popup with icons
#   link-group          grouped by relation     | one flat list, relation as a pill
#   activity-filter     tabs All / Comments / History | one filter dropdown
#   activity-composer   composer on top         | composer at the bottom

# ---- description ----------------------------------------------------------------------------------------------------------
opt.description:
    $type: AbTest
    id: description-style
    label: Description
    initial: card
    variants:
        card:
            label: Card with header strip
            hint: The description in a bordered card whose header strip carries the title (GitHub comment box).
            view:
                $type: task:Panel
                title: Description
                appearance: strip
                items:
                    - $use: body.edit
                    - $use: body.add
        plain:
            label: Plain
            hint: A heading and the text, no border and no strip.
            view:
                $type: task:Panel
                title: Description
                appearance: plain
                items:
                    - $use: body.edit
                    - $use: body.add

# ---- sub-tasks: the add style outside, the list style inside ---------------------------------------------------------------
# The four lists. Every one has the detach button of the rows (detachChild) and a progress bar.
subtasks.checklist.row:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    doneAction: setChildStatus
    reopenAction: setChildStatus
    detachAction: detachChild
    detachIdParam: childId
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    addAction: createSubtask
    parentId: $route.id
    titleKey: title
    placeholder: Add a sub-task
    progress: bar
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam
subtasks.checklist.none:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    doneAction: setChildStatus
    reopenAction: setChildStatus
    detachAction: detachChild
    detachIdParam: childId
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    progress: bar
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam
subtasks.table.row:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    appearance: table
    doneAction: setChildStatus
    reopenAction: setChildStatus
    detachAction: detachChild
    detachIdParam: childId
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    addAction: createSubtask
    parentId: $route.id
    titleKey: title
    placeholder: Add a sub-task
    progress: bar
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam
subtasks.table.none:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    appearance: table
    doneAction: setChildStatus
    reopenAction: setChildStatus
    detachAction: detachChild
    detachIdParam: childId
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    progress: bar
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam

# The list style, with the add row in the list (add = last row).
opt.subtask-list.row:
    $type: AbTest
    id: subtask-list
    label: Sub-task list
    initial: checklist
    variants:
        checklist:
            label: Checklist
            hint: A box, the id, the title and the status on one line per sub-task.
            view:
                $use: subtasks.checklist.row
        table:
            label: Compact table
            hint: A bordered table with a header row (Done, Sub-task, Status).
            view:
                $use: subtasks.table.row
# The list style, without an add row (the add is in the popup of the panel header).
opt.subtask-list.none:
    $type: AbTest
    id: subtask-list
    label: Sub-task list
    initial: checklist
    variants:
        checklist:
            label: Checklist
            hint: A box, the id, the title and the status on one line per sub-task.
            view:
                $use: subtasks.checklist.none
        table:
            label: Compact table
            hint: A bordered table with a header row (Done, Sub-task, Status).
            view:
                $use: subtasks.table.none

# The popup: a small form with icons (heading, field, button), opened by an "Add sub-task" button of the panel header.
subtasks.add.popup:
    $type: task:PropertyPopover
    label: Sub-task
    appearance: pill
    icon: add-sub-task
    valueText: Add sub-task
    align: end
    closeOnActions:
        - createSubtask
    params:
        $use: params.task
    items:
        - $type: task:TaskChecklist
          rows: []
          progress: none
          addStyle: form
          addAction: createSubtask
          parentId: $route.id
          titleKey: title
          placeholder: Title of the sub-task
          addHeading: New sub-task
          addButton: Create sub-task
          params:
              projectParam: $sources.detail.projectParam

opt.subtasks:
    $type: AbTest
    id: subtask-add
    label: Sub-task add
    initial: row
    variants:
        row:
            label: Last row
            hint: The field to add a sub-task is the last row of the list (Jira).
            view:
                $type: task:Panel
                title: Sub-tasks
                appearance: card
                count: $sources.detail.childrenSummary.total
                items:
                    - $use: opt.subtask-list.row
        popup:
            label: Popup with icons
            hint: An "Add sub-task" button in the panel header opens a small form with icons (GitLab).
            view:
                $type: task:Panel
                title: Sub-tasks
                appearance: card
                count: $sources.detail.childrenSummary.total
                actions:
                    - $use: subtasks.add.popup
                items:
                    - $use: opt.subtask-list.none

# ---- links (relations) -------------------------------------------------------------------------------------------------------
opt.links.view:
    $type: AbTest
    id: link-group
    label: Relations
    initial: grouped
    variants:
        grouped:
            label: Grouped by relation
            hint: One titled block per relation (Blocked by, Blocks...), each with its rows.
            view:
                $type: VerticalStack
                gap: gap-2
                items:
                    - $use: links.groups
                    - $use: links.none
        flat:
            label: Flat list
            hint: One list of every linked task, the relation as a pill on each row.
            view:
                $type: VerticalStack
                gap: gap-2
                items:
                    - $use: links.flat
                    - $use: links.none

# The last row of the panel: relation select (with the icon of the relation) and the task search on ONE line.
links.add.row:
    $type: task:TaskPicker
    ariaLabel: Task to link
    placeholder: Link a task (id or words)
    layout: row
    action: addLink
    bodyKey: target
    choices: $sources.detail.linkTypeOptions
    choiceKey: type
    choiceLabel: Relation
    projectParam: $sources.detail.projectParam
    excludeIds:
        - $route.id
    params:
        $use: params.task
# The popup: a heading, the relations as icon buttons, then the search.
links.add.popup:
    $type: task:PropertyPopover
    label: Link
    appearance: pill
    icon: link
    valueText: Add link
    align: end
    closeOnActions:
        - addLink
    params:
        $use: params.task
    items:
        - $type: task:TaskPicker
          ariaLabel: Task to link
          placeholder: Search a task to link
          heading: Link to another task
          choiceStyle: icons
          action: addLink
          bodyKey: target
          choices: $sources.detail.linkTypeOptions
          choiceKey: type
          choiceLabel: Relation
          projectParam: $sources.detail.projectParam
          excludeIds:
              - $route.id
          params:
              $use: params.task

opt.links:
    $type: AbTest
    id: link-add
    label: Link add
    initial: row
    variants:
        row:
            label: Last row
            hint: The relation and the task search are the last row of the panel (Jira).
            view:
                $type: task:Panel
                title: Relations
                appearance: card
                items:
                    - $type: VerticalStack
                      gap: gap-2
                      items:
                          - $use: opt.links.view
                          - $use: links.add.row
        popup:
            label: Popup with icons
            hint: An "Add link" button in the panel header opens a form whose relations are icon buttons (GitLab).
            view:
                $type: task:Panel
                title: Relations
                appearance: card
                actions:
                    - $use: links.add.popup
                items:
                    - $use: opt.links.view

# ---- activity ----------------------------------------------------------------------------------------------------------------
# The four feeds (filter x composer position). The shell renders a slot prop from a LIST of nodes.
activity.feed.tabs.top:
    $type: task:ActivityFeed
    rows: $sources.activity.rows
    filters:
        - all
        - comments
        - history
    composerPosition: top
    emptyText: No activity yet
    commentsContent:
        - $use: comments.thread
    composer:
        - $use: comments.composer
activity.feed.tabs.bottom:
    $type: task:ActivityFeed
    rows: $sources.activity.rows
    filters:
        - all
        - comments
        - history
    composerPosition: bottom
    emptyText: No activity yet
    commentsContent:
        - $use: comments.thread
    composer:
        - $use: comments.composer
activity.feed.select.top:
    $type: task:ActivityFeed
    rows: $sources.activity.rows
    filters:
        - all
        - comments
        - history
    filterAppearance: select
    composerPosition: top
    emptyText: No activity yet
    commentsContent:
        - $use: comments.thread
    composer:
        - $use: comments.composer
activity.feed.select.bottom:
    $type: task:ActivityFeed
    rows: $sources.activity.rows
    filters:
        - all
        - comments
        - history
    filterAppearance: select
    composerPosition: bottom
    emptyText: No activity yet
    commentsContent:
        - $use: comments.thread
    composer:
        - $use: comments.composer

opt.activity.composer.tabs:
    $type: AbTest
    id: activity-composer
    label: Comment composer
    initial: top
    variants:
        top:
            label: On top
            hint: The new comment field above the feed, which is newest first (GitHub, Jira).
            view:
                $use: activity.feed.tabs.top
        bottom:
            label: At the bottom
            hint: The new comment field after the feed (chat order).
            view:
                $use: activity.feed.tabs.bottom
opt.activity.composer.select:
    $type: AbTest
    id: activity-composer
    label: Comment composer
    initial: top
    variants:
        top:
            label: On top
            hint: The new comment field above the feed, which is newest first (GitHub, Jira).
            view:
                $use: activity.feed.select.top
        bottom:
            label: At the bottom
            hint: The new comment field after the feed (chat order).
            view:
                $use: activity.feed.select.bottom

opt.activity:
    $type: AbTest
    id: activity-filter
    label: Activity filter
    initial: tabs
    variants:
        tabs:
            label: Tabs
            hint: All, Comments and History as tabs with their counts.
            view:
                $type: task:Panel
                title: Activity
                appearance: plain
                items:
                    - $use: opt.activity.composer.tabs
        select:
            label: Dropdown
            hint: One filter dropdown (All activity, Comments only, History only) (GitLab).
            view:
                $type: task:Panel
                title: Activity
                appearance: plain
                items:
                    - $use: opt.activity.composer.select
