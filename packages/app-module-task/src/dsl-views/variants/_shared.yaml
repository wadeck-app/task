gitlab.b.parent:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: Badge
          $if: $sources.detail.hasParent
          label: $sources.detail.parentRow.titleText
          href: $sources.detail.parentRow.href
          variant: info
        - $use: feedback.wrapped.parent
        - $use: form.detachParent
        - $type: task:Panel
          title: Change parent
          appearance: plain
          collapsible: true
          defaultOpen: false
          items:
              - $use: form.setParent
gitlab.b.meta:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: task:KeyValueList
          $if: $sources.detail.hasMeta
          entries: $sources.detail.metaList
        - $use: feedback.wrapped.meta
        - $type: task:Panel
          title: Set metadata
          appearance: plain
          collapsible: true
          defaultOpen: false
          items:
              - $use: form.meta
gitlab.side.open:
    $type: VerticalStack
    gap: gap-3
    items:
        - $type: task:Panel
          title: Status
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.status
        - $type: task:Panel
          title: Type
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.type
        - $type: task:Panel
          title: Labels
          count: $sources.detail.labelCount
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.labels
        - $type: task:Panel
          title: Parent
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.parent
        - $type: task:Panel
          title: Metadata
          count: $sources.detail.metaCount
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.meta
gitlab.side.closed:
    $type: VerticalStack
    gap: gap-3
    items:
        - $type: task:Panel
          title: Status
          collapsible: true
          defaultOpen: true
          items:
              - $use: gitlab.b.status
        - $type: task:Panel
          title: Type
          collapsible: true
          defaultOpen: false
          items:
              - $use: gitlab.b.type
        - $type: task:Panel
          title: Labels
          count: $sources.detail.labelCount
          collapsible: true
          defaultOpen: false
          items:
              - $use: gitlab.b.labels
        - $type: task:Panel
          title: Parent
          collapsible: true
          defaultOpen: false
          items:
              - $use: gitlab.b.parent
        - $type: task:Panel
          title: Metadata
          count: $sources.detail.metaCount
          collapsible: true
          defaultOpen: false
          items:
              - $use: gitlab.b.meta
gitlab.p.description:
    $type: task:Panel
    $if: $sources.detail.hasDescription
    title: Description
    items:
        - $type: Markdown
          text: $sources.detail.descriptionText
gitlab.c.children:
    $type: VerticalStack
    gap: gap-3
    items:
        - $type: task:ProgressSummary
          $if: $sources.detail.hasChildren
          done: $sources.detail.childrenSummary.done
          total: $sources.detail.childrenSummary.total
          text: $sources.detail.childrenSummary.text
          appearance: bar
        - $type: task:TaskRowList
          rows: $sources.detail.children
          appearance: list
          emptyText: No child items
gitlab.c.links:
    $type: VerticalStack
    gap: gap-3
    items:
        - $type: task:TaskRowList
          rows: $sources.links.rows
          appearance: list
          emptyText: No linked items
        - $type: task:Panel
          title: Add or remove a link
          appearance: plain
          collapsible: true
          defaultOpen: false
          items:
              - $use: feedback.link
              - $use: form.addLink
              - $use: form.removeLink
gitlab.c.activity:
    $type: task:Timeline
    $if: $sources.detail.hasActivity
    entries: $sources.detail.activity
    groupByDay: true
    order: newest-first
gitlab.p.children:
    $type: task:Panel
    title: Child items
    count: $sources.detail.childrenSummary.total
    collapsible: true
    items:
        - $use: gitlab.c.children
gitlab.p.children.ifany:
    $type: task:Panel
    $if: $sources.detail.hasChildren
    title: Child items
    count: $sources.detail.childrenSummary.total
    collapsible: true
    items:
        - $use: gitlab.c.children
gitlab.p.links:
    $type: task:Panel
    title: Linked items
    count: $sources.detail.linkCount
    collapsible: true
    items:
        - $use: gitlab.c.links
gitlab.p.activity:
    $type: task:Panel
    title: Activity
    collapsible: true
    items:
        - $use: gitlab.c.activity
gitlab.main.show:
    $type: VerticalStack
    gap: gap-4
    items:
        - $use: gitlab.p.description
        - $use: gitlab.p.children
        - $use: gitlab.p.links
        - $use: gitlab.p.activity
gitlab.main.hide:
    $type: VerticalStack
    gap: gap-4
    items:
        - $use: gitlab.p.description
        - $use: gitlab.p.children.ifany
        - $use: gitlab.p.links
        - $use: gitlab.p.activity
gitlab.tabs.children:
    $type: VerticalStack
    gap: gap-4
    items:
        - $use: gitlab.p.description
        - $type: task:TabPanels
          counts:
              child-items: $sources.detail.childrenSummary.total
              linked-items: $sources.detail.linkCount
          tabs:
              - key: child-items
                label: Child items
                items:
                    - $use: gitlab.c.children
              - key: linked-items
                label: Linked items
                items:
                    - $use: gitlab.c.links
              - key: activity
                label: Activity
                items:
                    - $use: gitlab.c.activity
gitlab.tabs.links:
    $type: VerticalStack
    gap: gap-4
    items:
        - $use: gitlab.p.description
        - $type: task:TabPanels
          defaultTab: linked-items
          counts:
              child-items: $sources.detail.childrenSummary.total
              linked-items: $sources.detail.linkCount
          tabs:
              - key: child-items
                label: Child items
                items:
                    - $use: gitlab.c.children
              - key: linked-items
                label: Linked items
                items:
                    - $use: gitlab.c.links
              - key: activity
                label: Activity
                items:
                    - $use: gitlab.c.activity

# ---- github-b (GitHub sub-issues layout). Namespaced; used only by variants/github-b.yaml. ----------------------------
github-b.header:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: task:BreadcrumbTrail
          $if: $sources.detail.hasAncestors
          items: $sources.detail.ancestors
          separator: slash
          maxItems: 5
          currentLabel: $sources.detail.task.id
        - $type: PageHeader
          title: $sources.detail.task.title
          headerActions:
              - $type: ButtonLink
                $if: $sources.detail.taskHrefs
                label: History
                to: $sources.detail.taskHrefs.history
              - $type: ButtonLink
                $if: $sources.detail.taskHrefs
                label: Children
                to: $sources.detail.taskHrefs.childrenList
              - $type: ButtonLink
                $if: $sources.detail.taskHrefs
                label: Delete
                variant: danger-outline
                to: $sources.detail.taskHrefs.deleteTasks
        - $type: HorizontalStack
          gap: gap-2
          items:
              - $type: task:StatusBadge
                $if: $sources.detail.isOpen
                label: $sources.detail.task.status
                tone: $sources.detail.statusTone
                icon: open
                size: md
              - $type: task:StatusBadge
                $if: $sources.detail.isTerminal
                label: $sources.detail.task.status
                tone: $sources.detail.statusTone
                icon: done
                size: md
              - $type: Badge
                label: $sources.detail.projectText
                variant: info
              - $type: RelativeDate
                date: $sources.detail.updatedAt
              - $type: Badge
                $if: $sources.detail.blockedText
                label: $sources.detail.blockedText
                variant: warning
github-b.progress.bar:
    $type: task:ProgressSummary
    $if: $sources.detail.hasChildren
    done: $sources.detail.childrenSummary.done
    total: $sources.detail.childrenSummary.total
    text: $sources.detail.childrenSummary.text
    appearance: bar
github-b.progress.segments:
    $type: task:ProgressSummary
    $if: $sources.detail.hasChildren
    done: $sources.detail.childrenSummary.done
    total: $sources.detail.childrenSummary.total
    text: $sources.detail.childrenSummary.text
    appearance: segments
github-b.progress.ring:
    $type: task:ProgressSummary
    $if: $sources.detail.hasChildren
    done: $sources.detail.childrenSummary.done
    total: $sources.detail.childrenSummary.total
    text: $sources.detail.childrenSummary.text
    appearance: ring
github-b.sidebar:
    $type: task:PropertyList
    density: compact
    dividers: true
    items:
        - $type: task:PropertyRow
          label: Status
          items:
              - $type: task:ActionSelect
                $if: $sources.detail.forms
                appearance: pill
                ariaLabel: Status
                options: $sources.detail.statusChoices
                value: $sources.detail.task.status
                action: setStatusTo
                valueParam: status
                params: &githubBActionParams
                    id: $route.id
                    projectParam: $sources.detail.projectParam
              - $use: feedback.wrapped.status
        - $type: task:PropertyRow
          label: Type
          items:
              - $type: task:ActionSelect
                $if: $sources.detail.hasTypes
                appearance: field
                ariaLabel: Type
                options: $sources.detail.typeChoices
                value: $sources.detail.forms.type.type
                placeholder: No type
                action: setTypeTo
                valueParam: type
                params: *githubBActionParams
              - $use: notice.noTypes
              - $use: form.typeFree
              - $use: feedback.wrapped.type
        - $type: task:PropertyRow
          label: Labels
          items:
              - $type: task:LabelChips
                $if: $sources.detail.forms
                labels: $sources.detail.labelList
                labelKeys: $sources.detail.labelKeys
                addAction: addLabel
                removeAction: removeLabelChip
                labelParam: label
                placeholder: Add a label
                params: *githubBActionParams
              - $use: feedback.wrapped.label
        - $type: task:PropertyRow
          label: Parent
          items:
              - $type: Badge
                $if: $sources.detail.hasParent
                label: $sources.detail.parentRow.titleText
                href: $sources.detail.parentRow.href
                variant: info
              - $use: feedback.wrapped.parent
              - $use: form.detachParent
        - $type: task:PropertyRow
          $if: $sources.detail.hasMeta
          label: Metadata
          items:
              - $type: task:KeyValueList
                entries: $sources.detail.metaList
github-b.lists:
    $type: VerticalStack
    gap: gap-4
    items:
        - $type: task:Panel
          $if: $sources.detail.hasChildren
          title: Sub-issues
          count: $sources.detail.childrenSummary.total
          items:
              - $type: task:TaskRowList
                rows: $sources.detail.children
                appearance: list
        - $type: task:Panel
          $if: $sources.links.hasLinks
          title: Linked
          count: $sources.detail.linkCount
          items:
              - $type: task:TaskRowList
                rows: $sources.links.rows
                appearance: list
github-b.lists.folded:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: task:Panel
          $if: $sources.detail.hasChildren
          title: Sub-issues
          count: $sources.detail.childrenSummary.total
          collapsible: true
          defaultOpen: false
          items:
              - $type: task:TaskRowList
                rows: $sources.detail.children
                appearance: list
        - $type: task:Panel
          $if: $sources.links.hasLinks
          title: Linked
          count: $sources.detail.linkCount
          collapsible: true
          defaultOpen: false
          items:
              - $type: task:TaskRowList
                rows: $sources.links.rows
                appearance: list
github-b.body:
    $type: task:Panel
    $if: $sources.detail.hasDescription
    title: Description
    items:
        - $type: Markdown
          text: $sources.detail.descriptionText
github-b.edit.meta:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: task:KeyValueList
          $if: $sources.detail.hasMeta
          entries: $sources.detail.metaList
        - $use: feedback.meta
        - $use: form.meta
github-b.edit.parent:
    $type: VerticalStack
    gap: gap-2
    items:
        - $use: form.setParent
github-b.edit.links:
    $type: VerticalStack
    gap: gap-2
    items:
        - $use: feedback.link
        - $use: form.addLink
        - $use: form.removeLink
github-b.edit:
    $type: task:Panel
    title: Metadata, parent and links
    collapsible: true
    defaultOpen: false
    items:
        - $use: github-b.edit.meta
        - $use: github-b.edit.parent
        - $use: github-b.edit.links
github-b.activity:
    $type: task:Panel
    title: Activity
    collapsible: true
    defaultOpen: false
    items:
        - $type: task:Timeline
          $if: $sources.detail.hasActivity
          entries: $sources.detail.activity
          groupByDay: true
          order: oldest-first
gitlab-a.main:
    $type: task:VariantSwitcher
    id: gitlab-a-empty
    label: Empty sections
    initial: show
    variants:
        show:
            label: Shown
            hint: Child items, linked items and activity always have a panel, with a sentence when they are empty.
            view:
                $use: gitlab.main.show
        hide:
            label: Hidden
            hint: The child items panel is left out for a task without children; linked items stay because they hold the link forms.
            view:
                $use: gitlab.main.hide
gitlab-a.side:
    $type: task:VariantSwitcher
    id: gitlab-a-sections
    label: Sidebar sections
    initial: open
    variants:
        open:
            label: All open
            hint: Every sidebar section starts open.
            view:
                $use: gitlab.side.open
        closed:
            label: Closed
            hint: Only Status starts open; Type, Labels, Parent and Metadata fold to a title with a count.
            view:
                $use: gitlab.side.closed
gitlab-b.main:
    $type: task:VariantSwitcher
    id: gitlab-b-lower
    label: Below the description
    initial: tabs
    variants:
        tabs:
            label: Tabs
            hint: Child items, linked items and activity are tabs of one box, child items first, as in a GitLab work item.
            view:
                $use: gitlab.tabs.children
        tabs-links:
            label: Tabs, links first
            hint: The same tabs, opened on Linked items.
            view:
                $use: gitlab.tabs.links
        stacked:
            label: Stacked
            hint: The three blocks one under the other, each in a collapsible panel.
            view:
                $use: gitlab.main.show
gitlab-b.side:
    $type: task:VariantSwitcher
    id: gitlab-b-sections
    label: Sidebar sections
    initial: open
    variants:
        open:
            label: All open
            hint: Every sidebar section starts open.
            view:
                $use: gitlab.side.open
        closed:
            label: Closed
            hint: Only Status starts open; the other sections fold to a title with a count.
            view:
                $use: gitlab.side.closed
github-b.main:
    $type: VerticalStack
    gap: gap-4
    items:
        - $use: github-b.body
        - $type: task:VariantSwitcher
          id: github-b-lists
          label: Lists
          initial: open
          variants:
              open:
                  label: Open
                  hint: Sub-issues and linked tasks are open lists, shown only when they have rows.
                  view:
                      $use: github-b.lists
              folded:
                  label: Folded
                  hint: Sub-issues and linked tasks start folded to a title with a count.
                  view:
                      $use: github-b.lists.folded
        - $use: github-b.edit
        - $use: github-b.activity
