# Reusable fragments of the task page designs, referenced anywhere in a design as `{ $use: <name> }`. Each fragment is ONE
# node (or the one object `params.task`). Every control publishes its answer under the resultKey of its action; the single
# block `feedback.all` shows the error and the "events not delivered" notices of all of them, once per design. They are
# task:Notice, never a Badge: a Badge keeps one line, and the replay text of an undelivered event (a command with a JSON
# payload) runs off the screen.

# The {placeholders} of every action url: the task of the page and the project (already URL-encoded by the route).
params.task:
    id: $route.id
    projectParam: $sources.detail.projectParam

# ---- feedback: one block per design, every resultKey once --------------------------------------------------------------
feedback.all:
    $type: VerticalStack
    gap: gap-2
    items:
        - $type: task:Notice
          $if: $ctx.statusResult.errorText
          label: $ctx.statusResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.statusResult.undeliveredText
          label: $ctx.statusResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.typeResult.errorText
          label: $ctx.typeResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.typeResult.undeliveredText
          label: $ctx.typeResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.labelResult.errorText
          label: $ctx.labelResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.labelResult.undeliveredText
          label: $ctx.labelResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.metaResult.errorText
          label: $ctx.metaResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.metaResult.undeliveredText
          label: $ctx.metaResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.parentResult.errorText
          label: $ctx.parentResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.parentResult.undeliveredText
          label: $ctx.parentResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.linkResult.errorText
          label: $ctx.linkResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.linkResult.undeliveredText
          label: $ctx.linkResult.undeliveredText
          variant: warning
        # The x of a link row (removeLinkRow, own result key): drawn here, outside the relation groups, which vanish with the last link.
        - $type: task:Notice
          $if: $ctx.linkRowResult.errorText
          label: $ctx.linkRowResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.linkRowResult.undeliveredText
          label: $ctx.linkRowResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.textResult.errorText
          label: $ctx.textResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.textResult.undeliveredText
          label: $ctx.textResult.undeliveredText
          variant: warning
        - $type: task:Notice
          $if: $ctx.subtaskResult.errorText
          label: $ctx.subtaskResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.subtaskResult.undeliveredText
          label: $ctx.subtaskResult.undeliveredText
          variant: warning
        # addComment, editComment and removeComment share one key: the comment actions of the Activity block.
        - $type: task:Notice
          $if: $ctx.commentResult.errorText
          label: $ctx.commentResult.errorText
          variant: danger
        - $type: task:Notice
          $if: $ctx.commentResult.undeliveredText
          label: $ctx.commentResult.undeliveredText
          variant: warning

# ---- the identity of the task: the id once, the title once (editable in place) --------------------------------------------
# The id is shown here and nowhere else (the shell breadcrumb carries it too, but it is the shell's).
id.badge:
    $type: Badge
    label: $sources.detail.task.id
    variant: default
# The title is the headline (<= 90 characters; the body is the rest, see body.*). Enter saves, Esc cancels.
title.edit:
    $type: task:InlineText
    ariaLabel: Title
    value: $sources.detail.headline
    action: setText
    valueParam: title
    placeholder: Untitled
    textClass: text-xl font-semibold leading-snug
    params:
        $use: params.task
# Blocked by N open tasks: said once, in the header (the blockers themselves are the "Blocked by" relation).
blocked.notice:
    $type: task:Notice
    $if: $sources.detail.blockedText
    label: $sources.detail.blockedText
    variant: warning
# The STATE (Open / Closed) in the colour of the status: a derived fact (is the status terminal), not the status itself, which
# is edited by the one StatusSelect of the design. The DSL has no negation: one badge per flag.
state.open:
    $type: task:StatusBadge
    $if: $sources.detail.isOpen
    label: Open
    tone: $sources.detail.statusTone
    icon: open
    size: md
state.closed:
    $type: task:StatusBadge
    $if: $sources.detail.isTerminal
    label: Closed
    tone: $sources.detail.statusTone
    icon: done
    size: md
# "Opened 3 days ago": the creation date, shown once (the tooltip of the date holds the exact instant).
created.caption:
    $type: task:Caption
    text: Opened
created.date:
    $type: RelativeDate
    date: $sources.detail.createdAt

# ---- the body: shown when it says more than the headline; else an invitation to add one -----------------------------------
body.edit:
    $type: task:InlineText
    $if: $sources.detail.bodyAddsInfo
    multiline: true
    ariaLabel: Description
    value: $sources.detail.body
    action: setText
    valueParam: description
    textClass: text-sm leading-relaxed
    params:
        $use: params.task
body.add:
    $type: task:InlineText
    $if: $sources.detail.noBodyInfo
    multiline: true
    ariaLabel: Description
    value: ''
    placeholder: Add a description
    action: setText
    valueParam: description
    textClass: text-sm
    params:
        $use: params.task

# ---- the delete dialog: consequences first, ids never retyped -------------------------------------------------------
delete.dialog:
    $type: Dialog
    title: Delete this task?
    trigger:
        - $type: ButtonAction
          label: Delete task...
          variant: danger-outline
          size: sm
    items:
        - $type: task:Notice
          label: $sources.detail.deleteImpactText
          variant: warning
        - $type: Form
          $if: $sources.detail.forms
          onSubmit: $ctx.deleteTask
          initialData: $sources.detail.forms.delete
          fields:
              - $type: Switch
                $if: $sources.detail.hasDescendants
                label: $sources.detail.deleteCascadeLabel
                bind: cascade
          actions:
              - $type: ButtonAction
                label: Delete task
                variant: danger
                type: submit
# The overflow menu of the header: a popover holding the dialog. A PropertyPopover, so its trigger has the height of every other
# pill of the page (a ButtonAction is shorter), and it opens towards the left (it sits at the right edge).
menu.more:
    $type: task:PropertyPopover
    label: Menu
    appearance: pill
    valueText: Actions
    align: end
    items:
        - $use: delete.dialog

# ---- the properties: ONE editor each ------------------------------------------------------------------------------------
# The status: ONE compact select (the current status, tinted); its list opens only on click. Never a stepper.
status.select:
    $type: task:StatusSelect
    options: $sources.detail.statusOptions
    current: $sources.detail.task.status
    action: setStatus
    bodyKey: status
    params:
        $use: params.task
status.select.button:
    $type: task:StatusSelect
    appearance: button
    options: $sources.detail.statusOptions
    current: $sources.detail.task.status
    action: setStatus
    bodyKey: status
    params:
        $use: params.task
# The type: a "None" choice clears it. Where the property has its own heading (a row label, a section title) only the value shows.
prop.type.field:
    $type: task:PropertyPopover
    $if: $sources.detail.hasTypes
    label: Type
    appearance: field
    valueText: $sources.detail.task.type
    empty: None
    options: $sources.detail.typeOptions
    value: $sources.detail.forms.type.type
    action: setType
    bodyKey: type
    params:
        $use: params.task
prop.type.field.edit:
    $type: task:PropertyPopover
    $if: $sources.detail.hasTypes
    label: Type
    appearance: field
    actionLabel: Edit
    valueText: $sources.detail.task.type
    empty: None
    options: $sources.detail.typeOptions
    value: $sources.detail.forms.type.type
    action: setType
    bodyKey: type
    params:
        $use: params.task
# No type configured for the project: any text is a type, so the type is a text edited in place (empty clears it).
prop.type.free:
    $type: task:InlineText
    $if: $sources.detail.noTypes
    ariaLabel: Type
    value: $sources.detail.forms.type.type
    placeholder: Set a type
    allowEmpty: true
    action: setType
    valueParam: type
    params:
        $use: params.task
prop.labels:
    $type: task:LabelCombobox
    labels: $sources.detail.labelList
    labelKeys: $sources.detail.labelKeys
    addAction: addLabel
    removeAction: removeLabelChip
    labelParam: label
    projectParam: $sources.detail.projectParam
    placeholder: Add a label
    emptyText: No labels
    params:
        $use: params.task
# The picker of a parent: search by id or title, never offering the task or its descendants; "Open parent" is navigation.
parent.picker:
    - $type: ButtonLink
      $if: $sources.detail.hasParent
      label: Open parent
      size: sm
      to: $sources.detail.parentRow.href
    - $type: task:TaskPicker
      ariaLabel: New parent
      placeholder: Search a task to make the parent
      action: setParent
      bodyKey: parent
      projectParam: $sources.detail.projectParam
      excludeDescendantsOf: $route.id
      params:
          $use: params.task
    - $type: Form
      $if: $sources.detail.canDetach
      onSubmit: $ctx.removeParent
      initialData: $sources.detail.forms.empty
      fields: []
      actions:
          - $type: ButtonAction
            label: Detach from its parent
            variant: danger-outline
            size: sm
            type: submit
prop.parent.field:
    $type: task:PropertyPopover
    label: Parent
    appearance: field
    valueText: $sources.detail.parentRow.titleText
    empty: None
    closeOnActions:
        - setParent
        - removeParent
    params:
        $use: params.task
    items:
        $use: parent.picker
prop.parent.field.edit:
    $type: task:PropertyPopover
    label: Parent
    appearance: field
    actionLabel: Edit
    valueText: $sources.detail.parentRow.titleText
    empty: None
    closeOnActions:
        - setParent
        - removeParent
    params:
        $use: params.task
    items:
        $use: parent.picker
# Metadata: key/value chips, click a value to edit it, x removes, "+ Add" adds.
prop.meta:
    $type: task:MetaEditor
    entries: $sources.detail.metaEntries
    setAction: setMeta
    removeAction: removeMetaKey
    keyParam: key
    valueParam: value
    collapseAfter: 3
    emptyText: No metadata
    params:
        $use: params.task

# ---- links: the groups with an x per row, and the picker that adds one ---------------------------------------------------
links.groups:
    $type: ExtensionSlot
    $if: $sources.links.hasLinks
    items: $sources.links.groupSections
links.none:
    $type: task:Caption
    $if: $sources.links.noLinks
    text: No links yet
# Relation select, then a search by id or title: pick a task and the link is made. Closes after the action.
links.add:
    $type: task:PropertyPopover
    label: Link
    appearance: pill
    valueText: Add link
    closeOnActions:
        - addLink
    params:
        $use: params.task
    items:
        - $type: task:TaskPicker
          ariaLabel: Task to link
          placeholder: Search a task to link
          action: addLink
          bodyKey: target
          choices: $sources.detail.linkTypeOptions
          choiceKey: type
          choiceLabel: Relation
          projectParam: $sources.detail.projectParam
          excludeIds:
              - $route.id
          params:
              $use: params.task

# The same picker where the trigger sits at the right edge of a card header: the panel opens towards the left.
links.add.end:
    $type: task:PropertyPopover
    label: Link
    appearance: pill
    valueText: Add link
    align: end
    closeOnActions:
        - addLink
    params:
        $use: params.task
    items:
        - $type: task:TaskPicker
          ariaLabel: Task to link
          placeholder: Search a task to link
          action: addLink
          bodyKey: target
          choices: $sources.detail.linkTypeOptions
          choiceKey: type
          choiceLabel: Relation
          projectParam: $sources.detail.projectParam
          excludeIds:
              - $route.id
          params:
              $use: params.task

# ---- the sub-tasks: ONE checklist lists them; the add row is in it, or in an "Add sub-task" popover ----------------------
# The list with its add row and a progress ring.
subtasks.checklist.add:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    doneAction: setChildStatus
    reopenAction: setChildStatus
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    addAction: createSubtask
    parentId: $route.id
    titleKey: title
    placeholder: Add a sub-task
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam
# The list with a progress bar, no add row (the add row is in the popover below).
subtasks.checklist.bar:
    $type: task:TaskChecklist
    rows: $sources.detail.checklistRows
    progress: bar
    doneAction: setChildStatus
    reopenAction: setChildStatus
    terminalStatus: $sources.detail.terminalStatus
    reopenStatus: $sources.detail.reopenStatus
    emptyText: No sub-tasks yet
    params:
        projectParam: $sources.detail.projectParam
# The add row alone: a checklist without rows.
subtasks.add.only:
    $type: task:TaskChecklist
    rows: []
    progress: none
    addAction: createSubtask
    parentId: $route.id
    titleKey: title
    placeholder: Title of the sub-task
    params:
        projectParam: $sources.detail.projectParam
subtasks.add.popover:
    $type: task:PropertyPopover
    label: Sub-task
    appearance: pill
    valueText: Add sub-task
    closeOnActions:
        - createSubtask
    params:
        $use: params.task
    items:
        - $use: subtasks.add.only
# At the right edge of a card header: the panel opens towards the left.
subtasks.add.popover.end:
    $type: task:PropertyPopover
    label: Sub-task
    appearance: pill
    valueText: Add sub-task
    align: end
    closeOnActions:
        - createSubtask
    params:
        $use: params.task
    items:
        - $use: subtasks.add.only

# ---- the activity block: the comments of the Comments tab and the composer ----------------------------------------------------
# The Comments tab: edited in place (check / cross), deleted after a confirmation. {commentId} is the clicked comment.
comments.thread:
    $type: task:CommentThread
    comments: $sources.comments.comments
    editAction: editComment
    removeAction: removeComment
    emptyText: No comments yet
    params:
        $use: params.task
# One new plain-text comment: Ctrl+Enter sends, the field clears itself after success.
comments.composer:
    $type: task:CommentComposer
    action: addComment
    placeholder: Add a comment...
    params:
        $use: params.task

# ---- dates -------------------------------------------------------------------------------------------------------------------------------
dates.created.row:
    $type: task:PropertyRow
    label: Created
    items:
        - $use: created.date
dates.updated.row:
    $type: task:PropertyRow
    label: Updated
    items:
        - $type: RelativeDate
          date: $sources.detail.updatedAt
dates:
    $type: task:PropertyList
    density: compact
    labelPlacement: inline
    labelWidth: narrow
    items:
        - $use: dates.created.row
        - $use: dates.updated.row
