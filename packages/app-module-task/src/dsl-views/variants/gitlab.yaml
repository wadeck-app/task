label: GitLab
hint: Layout of a GitLab work item, from knowledge of it (no access to the product) - Open / Closed badge and the actions menu on the right of the header, the description, Child items and Linked items cards, Activity with a filter dropdown, and a right sidebar of collapsible sections with Edit links and the dates as a footer.
view:
    $type: task:WidthFrame
    width: wide
    items:
        - $type: VerticalStack
          gap: gap-4
          items:
              - $type: VerticalStack
                gap: gap-2
                items:
                    - $type: task:ChipRow
                      gap: gap-2
                      align: center
                      justify: between
                      items:
                          - $type: task:ChipRow
                            gap: gap-2
                            align: center
                            items:
                                - $use: state.open
                                - $use: state.closed
                                - $use: id.badge
                          - $use: menu.more
                    - $use: title.edit
                    - $use: blocked.notice
              - $type: task:SplitLayout
                sidePosition: right
                sideWidth: normal
                sticky: true
                sideFirstWhenStacked: true
                main:
                    - $type: VerticalStack
                      gap: gap-4
                      items:
                          # In the main column: a message that appears after a change in the sidebar must not push the sidebar down.
                          - $use: feedback.all
                          - $use: body.edit
                          - $use: body.add
                          - $type: task:Panel
                            title: Child items
                            appearance: card
                            count: $sources.detail.childrenSummary.total
                            actions:
                                - $use: subtasks.add.popover.end
                            items:
                                - $use: subtasks.checklist.bar
                          - $type: task:Panel
                            title: Linked items
                            appearance: card
                            actions:
                                - $use: links.add.end
                            items:
                                - $use: links.groups
                                - $use: links.none
                          - $type: task:Panel
                            title: Activity
                            appearance: plain
                            items:
                                - $type: task:ActivityFeed
                                  rows: $sources.activity.rows
                                  filters:
                                      - all
                                      - comments
                                      - history
                                  filterAppearance: select
                                  composerPosition: bottom
                                  emptyText: No activity yet
                                  commentsContent:
                                      - $use: comments.thread
                                  composer:
                                      - $use: comments.composer
                side:
                    - $type: VerticalStack
                      gap: gap-2
                      items:
                          - $type: task:Panel
                            title: Status
                            appearance: card
                            collapsible: true
                            items:
                                - $use: status.select
                          - $type: task:Panel
                            title: Type
                            appearance: card
                            collapsible: true
                            items:
                                - $use: prop.type.field.edit
                                - $use: prop.type.free
                          - $type: task:Panel
                            title: Parent
                            appearance: card
                            collapsible: true
                            items:
                                - $use: prop.parent.field.edit
                          - $type: task:Panel
                            title: Labels
                            appearance: card
                            collapsible: true
                            items:
                                - $use: prop.labels
                          - $type: task:Panel
                            title: Metadata
                            appearance: card
                            collapsible: true
                            items:
                                - $use: prop.meta
                          - $use: dates
