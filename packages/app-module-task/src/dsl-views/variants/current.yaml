# The page as shipped before the experiment, unchanged: the reference every other variant is compared with, and the one
# rendered whenever experiments are off (production). A test keeps its node tree equal to the page at the commit that
# introduced the experiment (src/backend/__fixtures__/task-page.head.yaml).
label: Current
hint: The page as shipped, a stack of sections.
view:
    $type: VerticalStack
    gap: gap-4
    items:
        - $type: PageHeader
          title: $sources.detail.task.title
          headerActions:
              - $type: ButtonLink
                $if: $sources.detail.taskHrefs
                label: History
                to: $sources.detail.taskHrefs.history
              - $type: ButtonLink
                $if: $sources.detail.taskHrefs
                label: Children
                to: $sources.detail.taskHrefs.childrenList
        - $type: HorizontalStack
          gap: gap-3
          $if: $sources.detail.task
          items:
              - $type: Badge
                label: $sources.detail.projectText
                variant: info
              - $type: Badge
                label: $sources.detail.task.status
                variant: info
              - $type: Badge
                $if: $sources.detail.task.type
                label: $sources.detail.task.type
                variant: info
              - $type: Badge
                $if: $sources.detail.parent
                label: $sources.detail.parent.title
                variant: info

        - $type: Section
          title: Status
          $if: $sources.detail.task
          items:
              # Events the queue did not receive after a status change: the change itself is saved.
              - $type: Badge
                $if: $ctx.statusResult.errorText
                label: $ctx.statusResult.errorText
                variant: danger
              - $type: Badge
                $if: $ctx.statusResult.undeliveredText
                label: $ctx.statusResult.undeliveredText
                variant: warning
              - $type: Form
                $if: $sources.detail.forms
                onSubmit: $ctx.setStatus
                initialData: $sources.detail.forms.status
                fields:
                    - $type: FieldSelect
                      label: Status
                      bind: status
                      options: $sources.detail.statusOptions
                actions:
                    - $type: ButtonSave
                      label: Change status

        - $type: Section
          title: Type
          $if: $sources.detail.task
          items:
              - $type: Badge
                $if: $ctx.typeResult.errorText
                label: $ctx.typeResult.errorText
                variant: danger
              # Events the queue did not receive: the change itself is saved.
              - $type: Badge
                $if: $ctx.typeResult.undeliveredText
                label: $ctx.typeResult.undeliveredText
                variant: warning
              # With configured types the choice is restricted; without any, every string is accepted.
              - $type: Form
                $if: $sources.detail.hasTypes
                onSubmit: $ctx.setType
                initialData: $sources.detail.forms.type
                fields:
                    - $type: FieldSelect
                      label: Type
                      bind: type
                      options: $sources.detail.typeOptions
                      placeholder: No type
                actions:
                    - $type: ButtonSave
                      label: Set type
              - $type: Badge
                $if: $sources.detail.noTypes
                label: No type is configured for this project (any text is accepted). Add some on the Types page.
                variant: info
              - $type: Form
                $if: $sources.detail.noTypes
                onSubmit: $ctx.setType
                initialData: $sources.detail.forms.type
                fields:
                    - $type: FieldText
                      label: Type (free text)
                      bind: type
                actions:
                    - $type: ButtonSave
                      label: Set type

        - $type: Section
          title: Labels
          $if: $sources.detail.task
          items:
              - $type: Badge
                $if: $ctx.labelResult.errorText
                label: $ctx.labelResult.errorText
                variant: danger
              # Events the queue did not receive: the change itself is saved.
              - $type: Badge
                $if: $ctx.labelResult.undeliveredText
                label: $ctx.labelResult.undeliveredText
                variant: warning
              - $type: DataTable
                rows: $sources.detail.labelRows
                emptyMessage: No labels
                columns:
                    - { key: 'label', label: 'Label' }
              - $type: Form
                $if: $sources.detail.forms
                onSubmit: $ctx.addLabel
                initialData: $sources.detail.forms.label
                fields:
                    - $type: FieldText
                      label: New label
                      bind: label
                actions:
                    - $type: ButtonSave
                      label: Add label
              # The placeholder matters: without it the select shows its first label while the form holds none, and
              # picking that label (the only one, typically) is no change, so the button stayed off.
              - $type: Form
                $if: $sources.detail.hasLabels
                onSubmit: $ctx.removeLabel
                initialData: $sources.detail.forms.label
                fields:
                    - $type: FieldSelect
                      label: Label to remove
                      bind: label
                      options: $sources.detail.labelOptions
                      placeholder: Choose a label
                actions:
                    - $type: ButtonSave
                      label: Remove label

        - $type: Section
          title: Metadata
          $if: $sources.detail.task
          items:
              - $type: Badge
                $if: $ctx.metaResult.errorText
                label: $ctx.metaResult.errorText
                variant: danger
              # Events the queue did not receive: the change itself is saved.
              - $type: Badge
                $if: $ctx.metaResult.undeliveredText
                label: $ctx.metaResult.undeliveredText
                variant: warning
              - $type: DataTable
                rows: $sources.detail.metaRows
                emptyMessage: No metadata
                columns:
                    - { key: 'key', label: 'Key', mono: true }
                    - { key: 'value', label: 'Value' }
              - $type: Form
                $if: $sources.detail.forms
                onSubmit: $ctx.setMeta
                initialData: $sources.detail.forms.meta
                fields:
                    - $type: FieldText
                      label: Key
                      bind: key
                    - $type: FieldText
                      label: Value
                      bind: value
                actions:
                    - $type: ButtonSave
                      label: Set metadata

        - $type: Section
          title: Hierarchy
          $if: $sources.detail.task
          items:
              - $type: Badge
                $if: $ctx.parentResult.errorText
                label: $ctx.parentResult.errorText
                variant: danger
              # Events the queue did not receive: the change itself is saved.
              - $type: Badge
                $if: $ctx.parentResult.undeliveredText
                label: $ctx.parentResult.undeliveredText
                variant: warning
              # The whole tree containing this task (its ancestors, siblings, children); its own row says "(this task)".
              - $type: DataTable
                rows: $sources.tree.rows
                navigateTo: '{href}'
                emptyMessage: No hierarchy
                columns:
                    - { key: 'label', label: 'Task' }
                    - { key: 'id', label: 'ID', mono: true, nowrap: true }
                    - { key: 'status', label: 'Status', nowrap: true }
              - $type: Form
                $if: $sources.detail.forms
                onSubmit: $ctx.setParent
                initialData: $sources.detail.forms.parent
                fields:
                    - $type: FieldText
                      label: New parent (task id or prefix)
                      bind: parent
                actions:
                    - $type: ButtonSave
                      label: Set parent
              # canDetach: also true for a parent that no longer exists (the warning above), the case to repair.
              - $type: Form
                $if: $sources.detail.canDetach
                onSubmit: $ctx.removeParent
                initialData: $sources.detail.forms.empty
                fields: []
                actions:
                    - $type: ButtonAction
                      label: Detach from its parent
                      variant: secondary
                      type: submit

        - $type: Section
          title: Links
          $if: $sources.detail.task
          items:
              - $type: Badge
                $if: $ctx.linkResult.errorText
                label: $ctx.linkResult.errorText
                variant: danger
              # Events the queue did not receive after a link change: the change itself is saved.
              - $type: Badge
                $if: $ctx.linkResult.undeliveredText
                label: $ctx.linkResult.undeliveredText
                variant: warning
              # The links grouped by relation (Blocked by, Blocks, Duplicate of, Duplicated by, Caused by, Causes), each group a titled
              # table of the linked tasks with a count; built by the route from `groups` (a view cannot loop).
              - $type: ExtensionSlot
                $if: $sources.links.hasLinks
                items: $sources.links.groupSections
              - $type: Badge
                $if: $sources.links.noLinks
                label: No links
                variant: info
              - $type: Form
                $if: $sources.detail.linkTypeOptions
                onSubmit: $ctx.addLink
                initialData: $sources.detail.forms.link
                fields:
                    - $type: FieldSelect
                      label: Relation
                      bind: type
                      options: $sources.detail.linkTypeOptions
                    - $type: FieldText
                      label: Other task (id or prefix)
                      bind: target
                actions:
                    - $type: ButtonSave
                      label: Add link
              - $type: Form
                $if: $sources.detail.linkTypeOptions
                onSubmit: $ctx.removeLink
                initialData: $sources.detail.forms.link
                fields:
                    - $type: FieldSelect
                      label: Relation
                      bind: type
                      options: $sources.detail.linkTypeOptions
                    - $type: FieldText
                      label: Other task (id or prefix)
                      bind: target
                actions:
                    - $type: ButtonSave
                      label: Remove link

        - $type: Section
          title: Children
          $if: $sources.detail.task
          items:
              - $type: DataTable
                rows: $sources.detail.children
                navigateTo: '{href}'
                emptyMessage: No children
                columns:
                    - { key: 'id', label: 'ID', mono: true, nowrap: true }
                    - { key: 'titleText', label: 'Title', truncate: true, title: '{title}' }
                    - { key: 'status', label: 'Status', nowrap: true }
