label: Issue
hint: Document first - the title and the text, sub-tasks as a checklist, relations grouped, with a sticky properties sidebar where each row opens its picker (GitHub, GitLab, Jira).
view:
    $type: task:WidthFrame
    width: wide
    items:
        - $type: VerticalStack
          gap: gap-4
          items:
              - $type: VerticalStack
                gap: gap-2
                items:
                    - $type: task:ChipRow
                      gap: gap-2
                      align: center
                      justify: between
                      items:
                          - $use: id.badge
                          - $use: menu.more
                    - $use: title.edit
                    - $use: blocked.notice
              - $type: task:SplitLayout
                sidePosition: right
                sideWidth: normal
                sticky: true
                sideFirstWhenStacked: true
                main:
                    - $type: VerticalStack
                      gap: gap-4
                      items:
                          # In the main column: a message that appears after a change in the sidebar must not push the sidebar down.
                          - $use: feedback.all
                          - $use: body.edit
                          - $use: body.add
                          - $type: task:Panel
                            title: Sub-tasks
                            items:
                                - $use: subtasks.checklist
                          - $type: task:Panel
                            title: Relations
                            actions:
                                - $use: links.add
                            items:
                                - $use: links.groups
                                - $use: links.none
                          - $type: task:Panel
                            title: Metadata
                            count: $sources.detail.metaCount
                            collapsible: true
                            defaultOpen: false
                            items:
                                - $use: prop.meta
                          - $type: task:Panel
                            title: Activity
                            collapsible: true
                            defaultOpen: false
                            items:
                                - $use: activity.timeline
                side:
                    - $type: VerticalStack
                      gap: gap-2
                      items:
                          - $use: prop.status.row
                          - $use: prop.type.row
                          - $use: prop.type.free
                          - $use: prop.parent.row
                          - $use: prop.labels.row
                          - $type: Divider
                          - $use: dates
