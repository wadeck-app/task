label: Flow
hint: For tasks made by a flow - a one-click status stepper, the long prompt folded to 6 lines, the steps as a checklist with a progress ring, the activity open under it.
view:
    $type: task:WidthFrame
    width: reading
    items:
        - $type: VerticalStack
          gap: gap-4
          items:
              - $type: VerticalStack
                gap: gap-2
                items:
                    - $type: task:ChipRow
                      gap: gap-2
                      align: center
                      justify: between
                      items:
                          - $use: id.badge
                          - $use: menu.more
                    - $use: title.edit
                    - $type: task:SegmentedControl
                      ariaLabel: Status
                      appearance: pills
                      options: $sources.detail.statusChoices
                      value: $sources.detail.task.status
                      action: setStatusTo
                      valueParam: status
                      params:
                          $use: params.task
                    - $use: blocked.notice
              - $use: feedback.all
              - $use: body.edit.folded
              - $use: body.add
              - $type: task:Panel
                title: Steps
                appearance: plain
                items:
                    - $use: subtasks.checklist
              - $type: task:ChipRow
                gap: gap-2
                align: center
                items:
                    - $use: prop.type.pill
                    - $use: prop.type.free
                    - $use: prop.labels
                    - $use: prop.parent.pill
                    - $use: links.add
                    - $use: prop.meta.pill
              - $type: task:Panel
                $if: $sources.links.hasLinks
                title: Relations
                appearance: plain
                items:
                    - $use: links.groups
              - $type: task:Panel
                title: Activity
                appearance: plain
                items:
                    - $use: activity.timeline
                    - $use: dates
