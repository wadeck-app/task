# Tasks of one project (/tasks/p/:project: the project is the path segment `:project` = $route.project; /tasks also shows
# the only registered project), or, on /tasks WITHOUT a project
# and with several projects registered, the global list: every project's open tasks with a Project column (source
# `tasks`, GET /tasks?allProjects=true). A row of either list opens the task with its project; the breadcrumb leads back (Tasks = the global list).
# Every scope goes through that one `scopeQuery`: project, global list, or `blank=true` (an unknown or unreadable
# project: the route answers nothing, which replaces the rows of the previous scope instead of leaving them on screen).
# Filters are links built by the route (the DSL has no component writing arbitrary URL parameters):
# ?showAll=true also lists the tasks in a terminal status, ?parent=<id> restricts to the direct children of a task.
# Each row carries `href` (built by the route, project query included): the row click opens the detail page.
# Status and label changes are on the detail page: the installed shell does not fill {id} in a row action URL (see CLAUDE.md).
# The sources that wait for `projects` also name a $urlParam (`reload`, empty in practice): the shell reloads on a URL
# change only the sources that name one, so without it the filter links and the project choice changed the URL only.
# The lists are `task:TaskList` (columns, widths, sort and filters live in the component): the route gives `titleText` (truncated),
# `created` / `updated` (short UTC) and `createdAt` / `updatedAt` (ISO, for the sort and the relative time).
# A header with actions shows no subtitle: the project is named by `projectText` below it.
# inlineErrors on every source: one failing source discards the answers of all the others (the page stays blank), so a
# failure is answered as data (`errorText`) and shown by a badge.
$sources:
    # First: the others wait for the project it resolved (a source whose {project} is empty is skipped, not failed).
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $route.project
            showAll: $urlParam.showAll
            parent: $urlParam.parent
            id: $urlParam.id
    tasks:
        url: GET /api/modules/task/tasks?{query}&inlineErrors=true
        params:
            # One source for both scopes: the shell keeps the last answer of a skipped source, so a second source for the
            # global list would leave the buttons of the previous project on screen after a trip to the global list (and the reverse).
            query: $source.projects.scopeQuery
            reload: $urlParam.reload
    # The contributions of other modules to the slot task:project-header (declared in manifest.json `expose`).
    projectHeader:
        url: GET /api/slots/task:project-header

$type: PageContent
sections:
    - $type: PageHeader
      title: Tasks
      headerActions:
          - $type: ButtonLink
            $if: $sources.tasks.hrefs
            label: New task
            variant: primary
            to: $sources.tasks.hrefs.newTask
          - $type: ButtonLink
            $if: $sources.tasks.showAllToggle
            label: $sources.tasks.showAllToggle.label
            to: $sources.tasks.showAllToggle.href
          - $type: ButtonLink
            $if: $sources.tasks.hrefs
            label: Delete tasks
            to: $sources.tasks.hrefs.deleteTasks
    # Extension point task:project-header: other modules (the project module...) contribute links/buttons about THIS project.
    # Per-project address only ($route.project is empty on /tasks, the contributions need it); the slot is shown once its
    # source answered (items is not an array before), and an empty slot draws nothing.
    - $type: task:ChipRow
      $if: $route.project
      items:
          - $type: ExtensionSlot
            $if: $sources.projectHeader
            items: $sources.projectHeader
    # Nothing registered yet: the welcome text of the route (the exact next step) instead of a blank page.
    - $type: Badge
      $if: $sources.projects.noProjects
      label: $sources.projects.noProjectsText
      variant: info
    - $type: Badge
      $if: $sources.tasks.projectText
      label: $sources.tasks.projectText
      variant: info
    # The selected project cannot be read (not initialized, corrupt config...): the reason and the fix, not a blank page.
    - $type: Badge
      $if: $sources.projects.selectedProblem
      label: $sources.projects.selectedProblem
      variant: danger
    # An unknown ?parent=... and the like: the reason, not a blank page.
    - $type: Badge
      $if: $sources.tasks.errorText
      label: $sources.tasks.errorText
      variant: danger
    # The address names a project the registry does not know: said, with the next step, not a blank page.
    - $type: Badge
      $if: $sources.projects.unknownProjectText
      label: $sources.projects.unknownProjectText
      variant: danger
    # Global list: what it covers, the projects it could not read (never dropped), or why nothing can be listed at all.
    - $type: Badge
      $if: $sources.tasks.scopeText
      label: $sources.tasks.scopeText
      variant: info
    - $type: Badge
      $if: $sources.tasks.warning
      label: $sources.tasks.warning
      variant: warning
    # Both lists are task:TaskList: default order = last update (newest first), sortable headers, client-side filters, the view kept in
    # the address (q, sort, dir, status, priority, assignee, projectIn, fav, updated: none of the page's own showAll, parent, project, reload).
    # The route sends the rows with updatedAt / updated; the global list has no priority nor assignee columns (no single set of priorities).
    - $type: task:TaskList
      $if: $sources.tasks.scopeText
      rows: $sources.tasks.tasks
      # Every readable project in importance order (favorites, priority) with its row count: the Project filter offers one with no task.
      projects: $sources.tasks.projects
      scope: all
      storageKey: all
      emptyMessage: No open tasks in any project yet ("Show closed tasks" includes the closed ones)
    - $type: HorizontalStack
      gap: gap-3
      $if: $sources.tasks.parentFilterText
      items:
          - $type: Badge
            label: $sources.tasks.parentFilterText
            variant: info
          - $type: ButtonLink
            label: Clear the filter
            size: sm
            to: $sources.tasks.clearParentHref
    # The EFFECTIVE priority ("medium (default)" when none is stored) and the holder, whose lease is the tooltip, come with the rows.
    - $type: task:TaskList
      $if: $sources.tasks.project
      rows: $sources.tasks.tasks
      scope: project
      storageKey: $sources.tasks.project.id
      emptyMessage: No open tasks yet. Use "New task" to create one ("Show closed tasks" includes the closed ones)
