label: Accordion
hint: One collapsible section per project (name, open/total, mini bar), filter, expand/collapse all. Only the open ones draw rows.
view:
    $type: AbTest
    id: accordion-open
    label: Open at start
    initial: last
    variants:
        last:
            label: Last used
            hint: The project opened last time (else the first)
            view:
                $type: task:ProjectAccordion
                projects: $sources.tree.overview.projects
                defaultOpen: last
        first:
            label: First
            hint: Only the first project
            view:
                $type: task:ProjectAccordion
                projects: $sources.tree.overview.projects
                defaultOpen: first
        none:
            label: None
            hint: Everything collapsed
            view:
                $type: task:ProjectAccordion
                projects: $sources.tree.overview.projects
                defaultOpen: none
