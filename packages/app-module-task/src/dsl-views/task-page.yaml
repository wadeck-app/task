      jira-a:
        label: Jira A
        hint: Jira issue view - ancestors as a breadcrumb above the title, description, child issues, linked issues and activity on the left, a Details panel on the right (status, type, labels and parent change on click) with a More fields group and the dates.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: task:VariantSwitcher
                  id: jira-a-ancestors
                  label: Breadcrumb
                  initial: shown
                  variants:
                    shown:
                      label: Shown
                      hint: The ancestors of the task as a breadcrumb above the title, the way Jira shows the parent chain.
                      view:
                        $type: task:BreadcrumbTrail
                        $if: $sources.detail.hasAncestors
                        items: $sources.detail.ancestors
                        separator: chevron
                        maxItems: 4
                        currentLabel: $sources.detail.task.id
                    hidden:
                      label: Hidden
                      hint: No breadcrumb; the parent is only in the Details panel.
                      view:
                        $type: VerticalStack
                        items: []
                - $type: PageHeader
                  title: $sources.detail.task.title
                  headerActions:
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: History
                      to: $sources.detail.taskHrefs.history
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: Children
                      to: $sources.detail.taskHrefs.childrenList
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: Delete
                      variant: danger-outline
                      to: $sources.detail.taskHrefs.deleteTasks
                - $type: HorizontalStack
                  $if: $sources.detail.blockedText
                  justify: justify-start
                  items:
                    - $type: Badge
                      label: $sources.detail.blockedText
                      variant: warning
                - $type: task:SplitLayout
                  sidePosition: right
                  sideWidth: normal
                  main:
                    - $type: VerticalStack
                      gap: gap-4
                      items:
                        - $type: VerticalStack
                          gap: gap-4
                          items:
                            - $type: task:Panel
                              $if: $sources.detail.hasDescription
                              title: Description
                              appearance: plain
                              items:
                                - $type: Markdown
                                  text: $sources.detail.descriptionText
                            - $type: task:Panel
                              $if: $sources.detail.hasChildren
                              title: Child issues
                              appearance: plain
                              count: $sources.detail.childrenSummary.total
                              items:
                                - $type: task:ProgressSummary
                                  done: $sources.detail.childrenSummary.done
                                  total: $sources.detail.childrenSummary.total
                                  text: $sources.detail.childrenSummary.text
                                  appearance: bar
                                - $type: task:TaskRowList
                                  rows: $sources.detail.children
                                  appearance: table
                                  density: compact
                            - $type: task:Panel
                              $if: $sources.links.hasLinks
                              title: Linked issues
                              appearance: plain
                              items:
                                - $type: task:TaskRowList
                                  rows: $sources.links.rows
                                  appearance: table
                                  density: compact
                        - $type: task:VariantSwitcher
                          id: jira-a-activity
                          label: Activity
                          initial: list
                          variants:
                            list:
                              label: List
                              hint: Activity block under the linked issues, with creation and every status change, newest first.
                              view:
                                $type: task:Panel
                                title: Activity
                                appearance: plain
                                items:
                                  - $type: task:Timeline
                                    $if: $sources.detail.hasActivity
                                    entries: $sources.detail.activity
                                    groupByDay: false
                                    order: newest-first
                            hidden:
                              label: Hidden
                              hint: No activity block; the page stops after the linked issues.
                              view:
                                $type: VerticalStack
                                items: []
                  side:
                    - $type: VerticalStack
                      gap: gap-3
                      items:
                        - $type: task:Panel
                          title: Details
                          items:
                            - $type: task:PropertyList
                              density: compact
                              labelPlacement: inline
                              labelWidth: narrow
                              dividers: false
                              items:
                                - $type: task:PropertyRow
                                  label: Status
                                  items:
                                    - $type: task:ActionSelect
                                      $if: $sources.detail.forms
                                      appearance: pill
                                      ariaLabel: Status
                                      options: $sources.detail.statusChoices
                                      value: $sources.detail.task.status
                                      action: setStatusTo
                                      valueParam: status
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                                    - $type: VerticalStack
                                      gap: gap-2
                                      items:
                                        - $type: task:Notice
                                          $if: $ctx.statusResult.errorText
                                          label: $ctx.statusResult.errorText
                                          variant: danger
                                        - $type: task:Notice
                                          $if: $ctx.statusResult.undeliveredText
                                          label: $ctx.statusResult.undeliveredText
                                          variant: warning
                                - $type: task:PropertyRow
                                  label: Type
                                  items:
                                    - $type: task:ActionSelect
                                      $if: $sources.detail.hasTypes
                                      appearance: ghost
                                      ariaLabel: Type
                                      options: $sources.detail.typeChoices
                                      value: $sources.detail.forms.type.type
                                      placeholder: No type
                                      action: setTypeTo
                                      valueParam: type
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                                    - $type: Badge
                                      $if: $sources.detail.noTypes
                                      label: No type is configured for this project (any text is accepted). Add some on the Types page.
                                      variant: info
                                    - $type: Form
                                      $if: $sources.detail.noTypes
                                      onSubmit: $ctx.setType
                                      initialData: $sources.detail.forms.type
                                      fields:
                                        - $type: FieldText
                                          label: Type (free text)
                                          bind: type
                                      actions:
                                        - $type: ButtonSave
                                          label: Set type
                                    - $type: VerticalStack
                                      gap: gap-2
                                      items:
                                        - $type: task:Notice
                                          $if: $ctx.typeResult.errorText
                                          label: $ctx.typeResult.errorText
                                          variant: danger
                                        - $type: task:Notice
                                          $if: $ctx.typeResult.undeliveredText
                                          label: $ctx.typeResult.undeliveredText
                                          variant: warning
                                - $type: task:PropertyRow
                                  label: Labels
                                  items:
                                    - $type: task:LabelChips
                                      $if: $sources.detail.forms
                                      labels: $sources.detail.labelList
                                      labelKeys: $sources.detail.labelKeys
                                      addAction: addLabel
                                      removeAction: removeLabelChip
                                      labelParam: label
                                      placeholder: Add a label
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                                    - $type: VerticalStack
                                      gap: gap-2
                                      items:
                                        - $type: task:Notice
                                          $if: $ctx.labelResult.errorText
                                          label: $ctx.labelResult.errorText
                                          variant: danger
                                        - $type: task:Notice
                                          $if: $ctx.labelResult.undeliveredText
                                          label: $ctx.labelResult.undeliveredText
                                          variant: warning
                                - $type: task:PropertyRow
                                  label: Parent
                                  items:
                                    - $type: Badge
                                      $if: $sources.detail.hasParent
                                      label: $sources.detail.parentRow.titleText
                                      href: $sources.detail.parentRow.href
                                      variant: info
                                    - $type: VerticalStack
                                      gap: gap-2
                                      items:
                                        - $type: task:Notice
                                          $if: $ctx.parentResult.errorText
                                          label: $ctx.parentResult.errorText
                                          variant: danger
                                        - $type: task:Notice
                                          $if: $ctx.parentResult.undeliveredText
                                          label: $ctx.parentResult.undeliveredText
                                          variant: warning
                                    - $type: Form
                                      $if: $sources.detail.canDetach
                                      onSubmit: $ctx.removeParent
                                      initialData: $sources.detail.forms.empty
                                      fields: []
                                      actions:
                                        - $type: ButtonAction
                                          label: Detach from its parent
                                          variant: secondary
                                          type: submit
                        - $type: task:VariantSwitcher
                          id: jira-a-details
                          label: Details groups
                          initial: open
                          variants:
                            open:
                              label: Open
                              hint: The More fields group (metadata, parent, links forms) is open under Details.
                              view:
                                $type: task:Panel
                                title: More fields
                                collapsible: true
                                defaultOpen: true
                                items:
                                  - $type: VerticalStack
                                    gap: gap-3
                                    items:
                                      - $type: task:KeyValueList
                                        $if: $sources.detail.hasMeta
                                        entries: $sources.detail.metaList
                                      - $type: VerticalStack
                                        gap: gap-2
                                        items:
                                          - $type: task:Notice
                                            $if: $ctx.metaResult.errorText
                                            label: $ctx.metaResult.errorText
                                            variant: danger
                                          - $type: task:Notice
                                            $if: $ctx.metaResult.undeliveredText
                                            label: $ctx.metaResult.undeliveredText
                                            variant: warning
                                      - $type: VerticalStack
                                        gap: gap-2
                                        items:
                                          - $type: task:Notice
                                            $if: $ctx.linkResult.errorText
                                            label: $ctx.linkResult.errorText
                                            variant: danger
                                          - $type: task:Notice
                                            $if: $ctx.linkResult.undeliveredText
                                            label: $ctx.linkResult.undeliveredText
                                            variant: warning
                                      - $type: task:Panel
                                        title: Edit fields
                                        appearance: plain
                                        collapsible: true
                                        defaultOpen: false
                                        items:
                                          - $type: Form
                                            $if: $sources.detail.forms
                                            onSubmit: $ctx.setMeta
                                            initialData: $sources.detail.forms.meta
                                            fields:
                                              - $type: FieldText
                                                label: Key
                                                bind: key
                                              - $type: FieldText
                                                label: Value
                                                bind: value
                                            actions:
                                              - $type: ButtonSave
                                                label: Set metadata
                                          - $type: Form
                                            $if: $sources.detail.forms
                                            onSubmit: $ctx.setParent
                                            initialData: $sources.detail.forms.parent
                                            fields:
                                              - $type: FieldText
                                                label: New parent (task id or prefix)
                                                bind: parent
                                            actions:
                                              - $type: ButtonSave
                                                label: Set parent
                                          - $type: Form
                                            $if: $sources.detail.linkTypeOptions
                                            onSubmit: $ctx.addLink
                                            initialData: $sources.detail.forms.link
                                            fields:
                                              - $type: FieldSelect
                                                label: Relation
                                                bind: type
                                                options: $sources.detail.linkTypeOptions
                                              - $type: FieldText
                                                label: Other task (id or prefix)
                                                bind: target
                                            actions:
                                              - $type: ButtonSave
                                                label: Add link
                                          - $type: Form
                                            $if: $sources.detail.linkTypeOptions
                                            onSubmit: $ctx.removeLink
                                            initialData: $sources.detail.forms.link
                                            fields:
                                              - $type: FieldSelect
                                                label: Relation
                                                bind: type
                                                options: $sources.detail.linkTypeOptions
                                              - $type: FieldText
                                                label: Other task (id or prefix)
                                                bind: target
                                            actions:
                                              - $type: ButtonSave
                                                label: Remove link
                            collapsed:
                              label: Collapsed
                              hint: The More fields group is folded; click its title to open it.
                              view:
                                $type: task:Panel
                                title: More fields
                                collapsible: true
                                defaultOpen: false
                                items:
                                  - $type: VerticalStack
                                    gap: gap-3
                                    items:
                                      - $type: task:KeyValueList
                                        $if: $sources.detail.hasMeta
                                        entries: $sources.detail.metaList
                                      - $type: VerticalStack
                                        gap: gap-2
                                        items:
                                          - $type: task:Notice
                                            $if: $ctx.metaResult.errorText
                                            label: $ctx.metaResult.errorText
                                            variant: danger
                                          - $type: task:Notice
                                            $if: $ctx.metaResult.undeliveredText
                                            label: $ctx.metaResult.undeliveredText
                                            variant: warning
                                      - $type: VerticalStack
                                        gap: gap-2
                                        items:
                                          - $type: task:Notice
                                            $if: $ctx.linkResult.errorText
                                            label: $ctx.linkResult.errorText
                                            variant: danger
                                          - $type: task:Notice
                                            $if: $ctx.linkResult.undeliveredText
                                            label: $ctx.linkResult.undeliveredText
                                            variant: warning
                                      - $type: task:Panel
