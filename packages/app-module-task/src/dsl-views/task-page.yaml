                                              - $type: FieldText
                                                label: Key
                                                bind: key
                                              - $type: FieldText
                                                label: Value
                                                bind: value
                                            actions:
                                              - $type: ButtonSave
                                                label: Set metadata
                                          - $type: Form
                                            $if: $sources.detail.forms
                                            onSubmit: $ctx.setParent
                                            initialData: $sources.detail.forms.parent
                                            fields:
                                              - $type: FieldText
                                                label: New parent (task id or prefix)
                                                bind: parent
                                            actions:
                                              - $type: ButtonSave
                                                label: Set parent
                                          - $type: Form
                                            $if: $sources.detail.linkTypeOptions
                                            onSubmit: $ctx.addLink
                                            initialData: $sources.detail.forms.link
                                            fields:
                                              - $type: FieldSelect
                                                label: Relation
                                                bind: type
