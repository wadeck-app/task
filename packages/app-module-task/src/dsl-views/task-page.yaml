      gitlab-a:
        label: GitLab A
        hint: GitLab work item - Open/Closed badge with age, description, then child items, linked items and activity as collapsible panels; the sidebar is a stack of collapsible sections (Status, Type, Labels, Parent, Metadata) with counts.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: VerticalStack
                  gap: gap-2
                  items:
                    - $type: task:BreadcrumbTrail
                      $if: $sources.detail.hasAncestors
                      items: $sources.detail.ancestors
                      separator: chevron
                      maxItems: 4
                      currentLabel: $sources.detail.task.id
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: task:StatusBadge
                          $if: $sources.detail.isOpen
                          label: Open
                          tone: $sources.detail.statusTone
                          icon: open
                          size: md
                        - $type: task:StatusBadge
                          $if: $sources.detail.isTerminal
                          label: Closed
                          tone: $sources.detail.statusTone
                          icon: done
                          size: md
                        - $type: Badge
                          label: $sources.detail.task.status
                          variant: info
                        - $type: Badge
                          label: $sources.detail.projectText
                          variant: info
                        - $type: RelativeDate
                          date: $sources.detail.createdAt
                        - $type: Badge
                          $if: $sources.detail.blockedText
                          label: $sources.detail.blockedText
                          variant: warning
                    - $type: PageHeader
                      title: $sources.detail.task.title
                      headerActions:
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: History
                          to: $sources.detail.taskHrefs.history
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Children
                          to: $sources.detail.taskHrefs.childrenList
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Delete
                          variant: danger-outline
                          to: $sources.detail.taskHrefs.deleteTasks
                - $type: task:VariantSwitcher
                  id: gitlab-a-sidebar
                  label: Sidebar
                  initial: right
                  variants:
                    right:
                      label: Right
                      hint: Sidebar sections on the right of the description, as GitLab does; stacks below 1024 px.
                      view:
                        $type: task:SplitLayout
                        sidePosition: right
                        main:
                          - $type: task:VariantSwitcher
                            id: gitlab-a-empty
                            label: Empty sections
                            initial: show
                            variants:
                              show:
                                label: Shown
                                hint: Child items, linked items and activity always have a panel, with a sentence when they are empty.
                                view:
                                  $type: VerticalStack
                                  gap: gap-4
                                  items:
                                    - $type: task:Panel
                                      $if: $sources.detail.hasDescription
                                      title: Description
                                      items:
                                        - $type: Markdown
                                          text: $sources.detail.descriptionText
                                    - $type: task:Panel
                                      title: Child items
                                      count: $sources.detail.childrenSummary.total
                                      collapsible: true
                                      items:
                                        - $type: VerticalStack
                                          gap: gap-3
                                          items:
                                            - $type: task:ProgressSummary
                                              $if: $sources.detail.hasChildren
                                              done: $sources.detail.childrenSummary.done
                                              total: $sources.detail.childrenSummary.total
                                              text: $sources.detail.childrenSummary.text
                                              appearance: bar
                                            - $type: task:TaskRowList
                                              rows: $sources.detail.children
                                              appearance: list
                                              emptyText: No child items
                                    - $type: task:Panel
                                      title: Linked items
                                      count: $sources.detail.linkCount
                                      collapsible: true
                                      items:
                                        - $type: VerticalStack
                                          gap: gap-3
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.links.rows
                                              appearance: list
                                              emptyText: No linked items
                                            - $type: task:Panel
                                              title: Add or remove a link
                                              appearance: plain
                                              collapsible: true
                                              defaultOpen: false
                                              items:
                                                - $type: VerticalStack
                                                  gap: gap-2
                                                  items:
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.errorText
                                                      label: $ctx.linkResult.errorText
                                                      variant: danger
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.undeliveredText
                                                      label: $ctx.linkResult.undeliveredText
                                                      variant: warning
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.addLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Add link
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.removeLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Remove link
                                    - $type: task:Panel
                                      title: Activity
                                      collapsible: true
                                      items:
                                        - $type: task:Timeline
                                          $if: $sources.detail.hasActivity
                                          entries: $sources.detail.activity
                                          groupByDay: true
                                          order: newest-first
                              hide:
                                label: Hidden
                                hint: The child items panel is left out for a task without children; linked items stay because they hold the link forms.
                                view:
                                  $type: VerticalStack
                                  gap: gap-4
                                  items:
                                    - $type: task:Panel
                                      $if: $sources.detail.hasDescription
                                      title: Description
                                      items:
                                        - $type: Markdown
                                          text: $sources.detail.descriptionText
                                    - $type: task:Panel
                                      $if: $sources.detail.hasChildren
                                      title: Child items
                                      count: $sources.detail.childrenSummary.total
                                      collapsible: true
                                      items:
                                        - $type: VerticalStack
                                          gap: gap-3
                                          items:
                                            - $type: task:ProgressSummary
                                              $if: $sources.detail.hasChildren
                                              done: $sources.detail.childrenSummary.done
                                              total: $sources.detail.childrenSummary.total
                                              text: $sources.detail.childrenSummary.text
                                              appearance: bar
                                            - $type: task:TaskRowList
                                              rows: $sources.detail.children
                                              appearance: list
                                              emptyText: No child items
                                    - $type: task:Panel
                                      title: Linked items
                                      count: $sources.detail.linkCount
                                      collapsible: true
                                      items:
                                        - $type: VerticalStack
                                          gap: gap-3
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.links.rows
                                              appearance: list
                                              emptyText: No linked items
                                            - $type: task:Panel
                                              title: Add or remove a link
                                              appearance: plain
                                              collapsible: true
                                              defaultOpen: false
                                              items:
                                                - $type: VerticalStack
                                                  gap: gap-2
                                                  items:
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.errorText
                                                      label: $ctx.linkResult.errorText
                                                      variant: danger
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.undeliveredText
                                                      label: $ctx.linkResult.undeliveredText
                                                      variant: warning
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.addLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Add link
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.removeLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Remove link
                                    - $type: task:Panel
                                      title: Activity
                                      collapsible: true
                                      items:
                                        - $type: task:Timeline
                                          $if: $sources.detail.hasActivity
                                          entries: $sources.detail.activity
                                          groupByDay: true
                                          order: newest-first
