# GENERATED - edit src/dsl-views/variants/*.yaml and run: npm run views --workspace=packages/app-module-task
# (scripts/generate-task-page.mjs). The comments below come from variants/_page.yaml.
# ============================================================================================================
# TASK PAGE - how this page is built (read this before editing task-page.yaml: it is GENERATED)
#
# `src/dsl-views/task-page.yaml` is assembled by `npm run views --workspace=packages/app-module-task` (script:
# scripts/generate-task-page.mjs at the repository root) from the files of this folder:
#   _page.yaml     this file: the sources, the actions, the notices and the experiment (design order, `variants`).
#                  Everything up to the line `$type: PageContent` is copied verbatim (comments included).
#   _shared.yaml   named fragments, used anywhere as `{ $use: prop.status.row }` (one node each; no other key next to $use).
#   <design>.yaml  one file per design with exactly three keys: `label`, `hint` (shown by the dock), `view` (ONE node).
# A test fails when task-page.yaml is stale, so run the script after every edit here.
#
# THREE DESIGNS under ONE dock row "Task page" (dsl-ui AbTest, production renders `initial` only). Each is a LAYOUT CLONE of a
# product, drawn from knowledge of it (no access to the real products), adapted to our data:
#   github  (initial) header with the Open / Closed badge, the description in a bordered card, sub-tasks and relations as cards,
#           the activity with the composer at the bottom, a right sidebar of sections separated by dividers
#   jira    action row under the title (Add sub-task, Link, Actions), Description, Child items with a progress bar, Linked items,
#           Activity with the composer on top, a sticky right "Details" panel with the status as a prominent button
#   gitlab  header with the state badge and the actions on the right, Child items and Linked items cards, Activity with a
#           filter dropdown, right collapsible sections with "Edit" links and a footer with the dates
# No design has an option row of its own. Each fact (id, status, type, parent, labels, dates, title, body, activity, comments) is
# shown ONCE per design, where it is edited (a test counts). The status is ONE task:StatusSelect, never a stepper or a visible list.
# The sidebar stacks ABOVE the main column below 1024 px in the three designs (task:SplitLayout sideFirstWhenStacked).
#
# Add a design: create <name>.yaml here and add <name> to `variants` under `$experiment` below, then run the script.
# BAKE THE WINNER: in this file keep $sources/$actions, replace the `AbTest` by the `view` of the chosen design (expand its
# `$use`), delete the other designs, the generator, `npm run views` and taskPageVariants.test.ts.
#
# Conventions for the components that run actions (dsl-ui >= 318: `onAction(name, params, { body })` sends a JSON body):
#   params: { id: $route.id, projectParam: $sources.detail.projectParam }   (fragment params.task), plus what the component adds
#   the value of a control travels in the body (status, type, label, parent, link, text, metadata, sub-task).
# ============================================================================================================

# Detail of one task (/modules/task/tasks/p/:project/:id). ":id" of the manifest path is $route.id, ":project" is
# $route.project (the id of the project, resolved by GET /projects). The breadcrumb and the tab strip lead elsewhere: no link here.
#
# Every control submits through a named action ($actions):
# - the body is what the component sends; `{placeholders}` of the url come from its `params` ({id} is the route id);
# - `projectParam` is the project already URL-encoded by the route, so the URL is always `?project={projectParam}`;
# - the page reloads its sources after a successful action;
# - `&inlineErrors=true`: the DSL drops the answer of a failed request, so the routes answer a failure as data (`errorText`,
#   one line with the hint) and the page shows it;
# - `resultKey` publishes the answer as $ctx.<key>: the error, and what the queue did not receive (`undeliveredText`),
#   are shown by the feedback block of the design (task:Notice, which wraps; a Badge keeps one line).
# The sources are fed by `projectQuery` (the project, else `blank=true`): the shell keeps the last answer of a source it
# skips, so an unknown or unreadable project must replace the previous task with an empty answer, not skip the request.
$sources:
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $route.project
    # inlineErrors on every source: one failing source discards the answers of all the others (the page stays blank), so a
    # failure is answered as data (`errorText`) and shown by a badge.
    # `links` fails with the same error as `detail` when the task does not exist: `detail` shows it.
    detail:
        url: GET /api/modules/task/tasks/{id}?{query}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    links:
        url: GET /api/modules/task/tasks/{id}/links?{query}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    # The Activity block: every row (status moves, recorded changes, comments), newest first; the tabs All / Comments / History
    # filter them in the component and count them. `filter=all` keeps the answer the same whatever tab is open.
    activity:
        url: GET /api/modules/task/tasks/{id}/activity?{query}&filter=all&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    # The comments (oldest first) for the Comments tab: edited and deleted in place (task:CommentThread).
    comments:
        url: GET /api/modules/task/tasks/{id}/comments?{query}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    # The contributions of other modules to the slot task:project-header (declared in manifest.json `expose`).
    projectHeader:
        url: GET /api/slots/task:project-header

$actions:
    setStatus:
        url: POST /api/modules/task/tasks/{id}/status?project={projectParam}&inlineErrors=true
        resultKey: statusResult
        reloadSources: true
    # An empty type (the "None" choice) clears the type.
    setType:
        url: POST /api/modules/task/tasks/{id}/type?project={projectParam}&inlineErrors=true
        resultKey: typeResult
        reloadSources: true
    addLabel:
        url: POST /api/modules/task/tasks/{id}/labels?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true
    # The x of a label chip: removes by the base64url key of the label ({labelKey}), which any label can travel in a path.
    removeLabelChip:
        url: DELETE /api/modules/task/tasks/{id}/label-keys/{labelKey}?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true
    setMeta:
        url: POST /api/modules/task/tasks/{id}/meta?project={projectParam}&inlineErrors=true
        resultKey: metaResult
        reloadSources: true
    # {keyKey} is the base64url key of the metadata key (a key may hold "/" or "%").
    removeMetaKey:
        url: DELETE /api/modules/task/tasks/{id}/meta-keys/{keyKey}?project={projectParam}&inlineErrors=true
        resultKey: metaResult
        reloadSources: true
    setParent:
        url: POST /api/modules/task/tasks/{id}/parent?project={projectParam}&inlineErrors=true
        resultKey: parentResult
        reloadSources: true
    removeParent:
        url: DELETE /api/modules/task/tasks/{id}/parent?project={projectParam}&inlineErrors=true
        resultKey: parentResult
        reloadSources: true
    addLink:
        url: POST /api/modules/task/tasks/{id}/links?project={projectParam}&inlineErrors=true
        resultKey: linkResult
        reloadSources: true
    # The x of a row of the link groups (task:TaskRowList, nodes built by the route): the row's `removeParams` fill the
    # placeholders, so nothing is retyped. {targetEncoded} is the named handler's percent-encoded copy of `target`.
    removeLinkRow:
        url: DELETE /api/modules/task/tasks/{id}/links?project={projectParam}&type={type}&target={targetEncoded}&inlineErrors=true
        resultKey: linkRowResult
        reloadSources: true
    # The title and the description (task:InlineText): body { title } or { description }.
    setText:
        url: PATCH /api/modules/task/tasks/{id}?project={projectParam}&inlineErrors=true
        resultKey: textResult
        reloadSources: true
    # The add row of the sub-task checklist: body { title, parent }.
    createSubtask:
        url: POST /api/modules/task/tasks?project={projectParam}&inlineErrors=true
        resultKey: subtaskResult
        reloadSources: true
    # The box of a sub-task: {id} is the id of the clicked row, body { status }.
    setChildStatus:
        url: POST /api/modules/task/tasks/{id}/status?project={projectParam}&inlineErrors=true
        resultKey: subtaskResult
        reloadSources: true
    # The comments (task:CommentComposer: body { text }; task:CommentThread: {commentId} is the clicked comment, body { text }).
    addComment:
        url: POST /api/modules/task/tasks/{id}/comments?project={projectParam}&inlineErrors=true
        resultKey: commentResult
        reloadSources: true
    editComment:
        url: PATCH /api/modules/task/tasks/{id}/comments/{commentId}?project={projectParam}&inlineErrors=true
        resultKey: commentResult
        reloadSources: true
    removeComment:
        url: DELETE /api/modules/task/tasks/{id}/comments/{commentId}?project={projectParam}&inlineErrors=true
        resultKey: commentResult
        reloadSources: true
    # The confirmation dialog: the body is forms.delete ({ ids, cascade, confirm: true }). The answer is read by the page-level
    # notices, because the task is gone afterwards and the design is not drawn any more.
    deleteTask:
        url: POST /api/modules/task/tasks/delete?project={projectParam}&inlineErrors=true
        resultKey: deleteResult
        reloadSources: true

$type: PageContent
maxWidth: full
sections:
  - $type: task:ChipRow
    $if: $route.project
    items:
      - $type: ExtensionSlot
        $if: $sources.projectHeader
        items: $sources.projectHeader
  - $type: task:Notice
    $if: $sources.projects.noProjects
    label: $sources.projects.noProjectsText
    variant: info
  - $type: task:Notice
    $if: $sources.projects.selectedProblem
    label: $sources.projects.selectedProblem
    variant: danger
  - $type: task:Notice
    $if: $sources.projects.unknownProjectText
    label: $sources.projects.unknownProjectText
    variant: danger
  - $type: task:Notice
    $if: $ctx.deleteResult.errorText
    label: $ctx.deleteResult.errorText
    variant: danger
  - $type: task:Notice
    $if: $ctx.deleteResult.deletedText
    label: $ctx.deleteResult.deletedText
    variant: success
  - $type: task:Notice
    $if: $ctx.deleteResult.undeliveredText
    label: $ctx.deleteResult.undeliveredText
    variant: warning
  - $type: task:Notice
    $if: $sources.detail.errorText
    label: $sources.detail.errorText
    variant: danger
  - $type: task:Notice
    $if: $sources.detail.warningText
    label: $sources.detail.warningText
    variant: warning
  - $type: AbTest
    id: task-design
    label: Task page
    initial: github
    variants:
      github:
        label: GitHub
        hint: Layout of a GitHub issue, from knowledge of it (no access to the product) - title, Open / Closed badge with the id and when it was opened, the description in a bordered card with a header strip, sub-tasks and relations as cards, the tabbed activity with the composer under it, and a right sidebar of sections separated by dividers.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: task:WidthFrame
              width: wide
              items:
                - $type: VerticalStack
                  gap: gap-4
                  items:
                    - $type: VerticalStack
                      gap: gap-2
                      items:
                        - $type: task:InlineText
                          ariaLabel: Title
                          value: $sources.detail.headline
                          action: setText
                          valueParam: title
                          placeholder: Untitled
                          textClass: text-xl font-semibold leading-snug
                          params:
                            id: $route.id
                            projectParam: $sources.detail.projectParam
                        - $type: task:ChipRow
                          gap: gap-2
                          align: center
                          justify: between
                          items:
                            - $type: task:ChipRow
                              gap: gap-2
                              align: center
                              items:
                                - $type: task:StatusBadge
                                  $if: $sources.detail.isOpen
                                  label: Open
                                  tone: $sources.detail.statusTone
                                  icon: open
                                  size: control
                                - $type: task:StatusBadge
                                  $if: $sources.detail.isTerminal
                                  label: Closed
                                  tone: $sources.detail.statusTone
                                  icon: done
                                  size: control
                                - $type: task:StatusBadge
                                  label: $sources.detail.task.id
                                  tone: neutral
                                  size: control
                                  mono: true
                                - $type: task:Caption
                                  text: Opened
                                - $type: RelativeDate
                                  date: $sources.detail.createdAt
                            - $type: task:PropertyPopover
                              label: Menu
                              appearance: pill
                              valueText: Actions
                              align: end
                              items:
                                - $type: Dialog
                                  title: Delete this task?
                                  trigger:
                                    - $type: ButtonAction
                                      label: Delete task...
                                      variant: danger-outline
                                      size: md
                                  items:
                                    - $type: VerticalStack
                                      gap: gap-4
                                      items:
                                        - $type: task:Notice
                                          label: $sources.detail.deleteImpactText
                                          variant: warning
                                        - $type: Form
                                          $if: $sources.detail.forms
                                          onSubmit: $ctx.deleteTask
                                          initialData: $sources.detail.forms.delete
                                          fields:
                                            - $type: Switch
                                              $if: $sources.detail.hasDescendants
                                              label: $sources.detail.deleteCascadeLabel
                                              bind: cascade
                                          actions:
                                            - $type: ButtonAction
                                              label: Delete task
                                              variant: danger
                                              type: submit
                        - $type: task:Notice
                          $if: $sources.detail.blockedText
                          label: $sources.detail.blockedText
                          variant: warning
                    - $type: task:SplitLayout
                      sidePosition: right
                      sideWidth: normal
                      sticky: true
                      sideFirstWhenStacked: true
                      main:
                        - $type: VerticalStack
                          gap: gap-4
                          items:
                            - $type: VerticalStack
                              gap: gap-2
                              items:
                                - $type: task:Notice
                                  $if: $ctx.statusResult.errorText
                                  label: $ctx.statusResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.statusResult.undeliveredText
                                  label: $ctx.statusResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.typeResult.errorText
                                  label: $ctx.typeResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.typeResult.undeliveredText
                                  label: $ctx.typeResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.labelResult.errorText
                                  label: $ctx.labelResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.labelResult.undeliveredText
                                  label: $ctx.labelResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.metaResult.errorText
                                  label: $ctx.metaResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.metaResult.undeliveredText
                                  label: $ctx.metaResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.parentResult.errorText
                                  label: $ctx.parentResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.parentResult.undeliveredText
                                  label: $ctx.parentResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.linkResult.errorText
                                  label: $ctx.linkResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.linkResult.undeliveredText
                                  label: $ctx.linkResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.linkRowResult.errorText
                                  label: $ctx.linkRowResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.linkRowResult.undeliveredText
                                  label: $ctx.linkRowResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.textResult.errorText
                                  label: $ctx.textResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.textResult.undeliveredText
                                  label: $ctx.textResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.subtaskResult.errorText
                                  label: $ctx.subtaskResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.subtaskResult.undeliveredText
                                  label: $ctx.subtaskResult.undeliveredText
                                  variant: warning
                                - $type: task:Notice
                                  $if: $ctx.commentResult.errorText
                                  label: $ctx.commentResult.errorText
                                  variant: danger
                                - $type: task:Notice
                                  $if: $ctx.commentResult.undeliveredText
                                  label: $ctx.commentResult.undeliveredText
                                  variant: warning
                            - $type: task:Panel
                              title: Description
                              appearance: strip
                              items:
                                - $type: task:InlineText
                                  $if: $sources.detail.bodyAddsInfo
                                  multiline: true
                                  ariaLabel: Description
                                  value: $sources.detail.body
                                  action: setText
                                  valueParam: description
                                  textClass: text-sm leading-relaxed
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                                - $type: task:InlineText
                                  $if: $sources.detail.noBodyInfo
                                  multiline: true
                                  ariaLabel: Description
                                  value: ''
                                  placeholder: Add a description
                                  action: setText
                                  valueParam: description
                                  textClass: text-sm
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                            - $type: task:Panel
                              title: Sub-tasks
                              appearance: strip
                              items:
                                - $type: task:TaskChecklist
                                  rows: $sources.detail.checklistRows
                                  doneAction: setChildStatus
                                  reopenAction: setChildStatus
                                  terminalStatus: $sources.detail.terminalStatus
                                  reopenStatus: $sources.detail.reopenStatus
                                  addAction: createSubtask
                                  parentId: $route.id
                                  titleKey: title
                                  placeholder: Add a sub-task
                                  emptyText: No sub-tasks yet
                                  params:
                                    projectParam: $sources.detail.projectParam
                            - $type: task:Panel
                              title: Relations
                              appearance: strip
                              actions:
                                - $type: task:PropertyPopover
                                  label: Link
                                  appearance: pill
                                  valueText: Add link
                                  align: end
                                  closeOnActions:
                                    - addLink
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                                  items:
                                    - $type: task:TaskPicker
                                      ariaLabel: Task to link
                                      placeholder: Search a task to link
                                      action: addLink
                                      bodyKey: target
                                      choices: $sources.detail.linkTypeOptions
                                      choiceKey: type
                                      choiceLabel: Relation
                                      projectParam: $sources.detail.projectParam
                                      excludeIds:
                                        - $route.id
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                              items:
                                - $type: ExtensionSlot
                                  $if: $sources.links.hasLinks
                                  items: $sources.links.groupSections
                                - $type: task:Caption
                                  $if: $sources.links.noLinks
                                  text: No links yet
                            - $type: task:Panel
                              title: Activity
                              appearance: plain
                              items:
                                - $type: task:ActivityFeed
                                  rows: $sources.activity.rows
                                  filters:
                                    - all
                                    - comments
                                    - history
                                  composerPosition: bottom
                                  emptyText: No activity yet
                                  commentsContent:
                                    - $type: task:CommentThread
                                      comments: $sources.comments.comments
                                      editAction: editComment
                                      removeAction: removeComment
                                      emptyText: No comments yet
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                                  composer:
                                    - $type: task:CommentComposer
                                      action: addComment
                                      placeholder: Add a comment...
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                      side:
                        - $type: VerticalStack
                          gap: gap-4
                          items:
                            - $type: task:Panel
                              title: Status
                              appearance: plain
                              items:
                                - $type: task:StatusSelect
                                  options: $sources.detail.statusOptions
                                  current: $sources.detail.task.status
                                  action: setStatus
                                  bodyKey: status
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                            - $type: Divider
                            - $type: task:Panel
                              title: Type
                              appearance: plain
                              items:
                                - $type: task:PropertyPopover
                                  $if: $sources.detail.hasTypes
                                  label: Type
                                  appearance: field
                                  valueText: $sources.detail.task.type
                                  empty: None
                                  options: $sources.detail.typeOptions
                                  value: $sources.detail.forms.type.type
                                  action: setType
                                  bodyKey: type
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                                - $type: task:InlineText
                                  $if: $sources.detail.noTypes
                                  ariaLabel: Type
                                  value: $sources.detail.forms.type.type
                                  placeholder: Set a type
                                  allowEmpty: true
                                  action: setType
                                  valueParam: type
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                            - $type: Divider
                            - $type: task:Panel
                              title: Parent
                              appearance: plain
                              items:
                                - $type: task:PropertyPopover
                                  label: Parent
                                  appearance: field
                                  valueText: $sources.detail.parentRow.titleText
                                  empty: None
                                  closeOnActions:
                                    - setParent
                                    - removeParent
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                                  items:
