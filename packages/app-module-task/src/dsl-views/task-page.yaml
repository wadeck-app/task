      gitlab-b:
        label: GitLab B
        hint: GitLab work item with tabs - same sidebar as GitLab A, but child items, linked items and activity are tabs of one box instead of a stack.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: VerticalStack
                  gap: gap-2
                  items:
                    - $type: task:BreadcrumbTrail
                      $if: $sources.detail.hasAncestors
                      items: $sources.detail.ancestors
                      separator: chevron
                      maxItems: 4
                      currentLabel: $sources.detail.task.id
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: task:StatusBadge
                          $if: $sources.detail.isOpen
                          label: Open
                          tone: $sources.detail.statusTone
                          icon: open
                          size: md
                        - $type: task:StatusBadge
                          $if: $sources.detail.isTerminal
                          label: Closed
                          tone: $sources.detail.statusTone
                          icon: done
                          size: md
                        - $type: Badge
                          label: $sources.detail.task.status
                          variant: info
                        - $type: Badge
                          label: $sources.detail.projectText
                          variant: info
                        - $type: RelativeDate
                          date: $sources.detail.createdAt
                        - $type: Badge
                          $if: $sources.detail.blockedText
                          label: $sources.detail.blockedText
                          variant: warning
                    - $type: PageHeader
                      title: $sources.detail.task.title
                      headerActions:
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: History
                          to: $sources.detail.taskHrefs.history
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Children
                          to: $sources.detail.taskHrefs.childrenList
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Delete
                          variant: danger-outline
                          to: $sources.detail.taskHrefs.deleteTasks
                - $type: task:VariantSwitcher
                  id: gitlab-b-sidebar
                  label: Sidebar
                  initial: right
                  variants:
                    right:
                      label: Right
                      hint: Sidebar sections on the right of the description; stacks below 1024 px.
                      view:
                        $type: task:SplitLayout
                        sidePosition: right
                        main:
                          - $type: task:VariantSwitcher
                            id: gitlab-b-lower
                            label: Below the description
                            initial: tabs
                            variants:
                              tabs:
                                label: Tabs
                                hint: Child items, linked items and activity are tabs of one box, child items first, as in a GitLab work item.
                                view:
                                  $type: VerticalStack
                                  gap: gap-4
                                  items:
                                    - $type: task:Panel
                                      $if: $sources.detail.hasDescription
                                      title: Description
                                      items:
                                        - $type: Markdown
                                          text: $sources.detail.descriptionText
                                    - $type: task:TabPanels
                                      counts:
                                        child-items: $sources.detail.childrenSummary.total
                                        linked-items: $sources.detail.linkCount
                                      tabs:
                                        - key: child-items
                                          label: Child items
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-3
                                              items:
                                                - $type: task:ProgressSummary
                                                  $if: $sources.detail.hasChildren
                                                  done: $sources.detail.childrenSummary.done
                                                  total: $sources.detail.childrenSummary.total
                                                  text: $sources.detail.childrenSummary.text
                                                  appearance: bar
                                                - $type: task:TaskRowList
                                                  rows: $sources.detail.children
                                                  appearance: list
                                                  emptyText: No child items
                                        - key: linked-items
                                          label: Linked items
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-3
