# Detail of one task (/modules/task/tasks/:id). ":id" of the manifest path is $route.id; the project comes from ?project=.
#
# Every form below submits through a named action ($actions) bound with `onSubmit: $ctx.<action>`:
# - the body is the form data; it also fills the {placeholders} of the action URL ({id} is the route id);
# - `projectParam` is the project already URL-encoded by the route (the substitution does not encode), so the URL is
#   always `?project={projectParam}`; the forms get it through their initialData (`$sources.detail.forms.*`);
# - the page reloads its sources after a successful action; a failed one shows nothing (the DSL has no error channel
#   for actions: see CLAUDE.md), the form just keeps its unsaved state;
# - `resultKey` publishes the answer as $ctx.<key>: used to show what the queue did not receive (`undeliveredText`).
# FieldSelect crashes the page while its options are not loaded: every form sits behind $if on its source data.
$sources:
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $urlParam.project
    detail:
        url: GET /api/modules/task/tasks/{id}?{query}
        params:
            id: $route.id
            query: $source.projects.selectedQuery
    tree:
        url: GET /api/modules/task/tree?{query}&id={id}
        params:
            id: $route.id
            query: $source.projects.selectedQuery
    links:
        url: GET /api/modules/task/tasks/{id}/links?{query}
        params:
            id: $route.id
            query: $source.projects.selectedQuery

$actions:
    setStatus:
        url: POST /api/modules/task/tasks/{id}/status?project={projectParam}
        resultKey: statusResult
        reloadSources: true
    setType:
        url: POST /api/modules/task/tasks/{id}/type?project={projectParam}
        reloadSources: true
    addLabel:
        url: POST /api/modules/task/tasks/{id}/labels?project={projectParam}
        reloadSources: true
    # {label} is the encoded label picked in the select.
    removeLabel:
        url: DELETE /api/modules/task/tasks/{id}/labels/{label}?project={projectParam}
        reloadSources: true
    setMeta:
        url: POST /api/modules/task/tasks/{id}/meta?project={projectParam}
        reloadSources: true
    setParent:
        url: POST /api/modules/task/tasks/{id}/parent?project={projectParam}
        reloadSources: true
    removeParent:
        url: DELETE /api/modules/task/tasks/{id}/parent?project={projectParam}
        reloadSources: true
    addLink:
        url: POST /api/modules/task/tasks/{id}/links?project={projectParam}
        resultKey: linkResult
        reloadSources: true
    removeLink:
        url: DELETE /api/modules/task/tasks/{id}/links?project={projectParam}
        resultKey: linkResult
        reloadSources: true

$type: PageContent
sections:
    - $type: PageHeader
      title: $sources.detail.task.title
      subtitle: $sources.detail.task.description
      headerActions:
          - $type: ButtonLink
            $if: $sources.detail.taskHrefs
            label: History
            to: $sources.detail.taskHrefs.history
          - $type: ButtonLink
            $if: $sources.detail.taskHrefs
            label: Children
            to: $sources.detail.taskHrefs.childrenList
          - $type: ButtonLink
            $if: $sources.detail.hrefs
            label: All tasks
            to: $sources.detail.hrefs.tasks
    # Repairable inconsistencies of this task (dangling parent...), with the command that fixes them.
    - $type: Badge
      $if: $sources.detail.warningText
      label: $sources.detail.warningText
      variant: warning
    # Events the queue did not receive after a status change or a link change: the change itself is saved.
    - $type: Badge
      $if: $ctx.statusResult.undeliveredText
      label: $ctx.statusResult.undeliveredText
      variant: warning
    - $type: Badge
      $if: $ctx.linkResult.undeliveredText
      label: $ctx.linkResult.undeliveredText
      variant: warning
    - $type: HorizontalStack
      gap: gap-3
      items:
          - $type: Badge
            label: $sources.detail.task.status
            variant: info
          - $type: Badge
            $if: $sources.detail.task.type
            label: $sources.detail.task.type
            variant: info
          - $type: Badge
            $if: $sources.detail.parent
            label: $sources.detail.parent.title
            variant: info

    - $type: Section
      title: Status
      items:
          - $type: Form
            $if: $sources.detail.forms
            onSubmit: $ctx.setStatus
            initialData: $sources.detail.forms.status
            fields:
                - $type: FieldSelect
                  label: Status
                  bind: status
                  options: $sources.detail.statusOptions
            actions:
                - $type: ButtonSave
                  label: Change status

    - $type: Section
      title: Type
      items:
          # With configured types the choice is restricted; without any, every string is accepted.
          - $type: Form
            $if: $sources.detail.hasTypes
            onSubmit: $ctx.setType
            initialData: $sources.detail.forms.type
            fields:
                - $type: FieldSelect
                  label: Type
                  bind: type
                  options: $sources.detail.typeOptions
                  placeholder: No type
            actions:
                - $type: ButtonSave
                  label: Set type
          - $type: Badge
            $if: $sources.detail.noTypes
            label: No type is configured for this project (any text is accepted). Add some on the Types page.
            variant: info
          - $type: Form
            $if: $sources.detail.noTypes
            onSubmit: $ctx.setType
            initialData: $sources.detail.forms.type
            fields:
                - $type: FieldText
                  label: Type (free text)
                  bind: type
            actions:
                - $type: ButtonSave
                  label: Set type

    - $type: Section
      title: Labels
      items:
          - $type: DataTable
            rows: $sources.detail.labelRows
            emptyMessage: No labels
            columns:
                - { key: 'label', label: 'Label' }
          - $type: Form
            $if: $sources.detail.forms
            onSubmit: $ctx.addLabel
            initialData: $sources.detail.forms.label
            fields:
                - $type: FieldText
                  label: New label
                  bind: label
            actions:
                - $type: ButtonSave
                  label: Add label
          - $type: Form
            $if: $sources.detail.hasLabels
            onSubmit: $ctx.removeLabel
            initialData: $sources.detail.forms.label
            fields:
                - $type: FieldSelect
                  label: Label to remove
                  bind: label
                  options: $sources.detail.labelOptions
            actions:
                - $type: ButtonSave
                  label: Remove label

    - $type: Section
      title: Metadata
      items:
          - $type: DataTable
            rows: $sources.detail.metaRows
            emptyMessage: No metadata
            columns:
                - { key: 'key', label: 'Key', mono: true }
                - { key: 'value', label: 'Value' }
          - $type: Form
            $if: $sources.detail.forms
            onSubmit: $ctx.setMeta
            initialData: $sources.detail.forms.meta
            fields:
                - $type: FieldText
                  label: Key
                  bind: key
                - $type: FieldText
                  label: Value
                  bind: value
            actions:
                - $type: ButtonSave
                  label: Set metadata

    - $type: Section
      title: Hierarchy
      items:
          # The whole tree containing this task (its ancestors, siblings, children); the row of this task is flagged.
          - $type: DataTable
            rows: $sources.tree.rows
            navigateTo: '{href}'
            emptyMessage: No hierarchy
            columns:
                - { key: 'label', label: 'Task' }
                - { key: 'id', label: 'ID', mono: true }
                - { key: 'status', label: 'Status' }
          - $type: Form
            $if: $sources.detail.forms
            onSubmit: $ctx.setParent
            initialData: $sources.detail.forms.parent
            fields:
                - $type: FieldText
                  label: New parent (task id or prefix)
                  bind: parent
            actions:
                - $type: ButtonSave
                  label: Set parent
          - $type: Form
            $if: $sources.detail.parent
            onSubmit: $ctx.removeParent
            initialData: $sources.detail.forms.empty
            fields: []
            actions:
                - $type: ButtonAction
                  label: Detach from its parent
                  variant: secondary
                  type: submit

    - $type: Section
      title: Links
      items:
          # Outgoing links and the inverses derived from the links of the other tasks (blocks, duplicates, causes).
          - $type: DataTable
            rows: $sources.links.rows
            navigateTo: '{href}'
            emptyMessage: No links
            columns:
                - { key: 'relation', label: 'Relation' }
                - { key: 'direction', label: 'Direction' }
                - { key: 'id', label: 'Task', mono: true }
                - { key: 'title', label: 'Title' }
                - { key: 'status', label: 'Status' }
          - $type: Form
            $if: $sources.detail.linkTypeOptions
            onSubmit: $ctx.addLink
            initialData: $sources.detail.forms.link
            fields:
                - $type: FieldSelect
                  label: Relation
                  bind: type
                  options: $sources.detail.linkTypeOptions
                - $type: FieldText
                  label: Other task (id or prefix)
                  bind: target
            actions:
                - $type: ButtonSave
                  label: Add link
          - $type: Form
            $if: $sources.detail.linkTypeOptions
            onSubmit: $ctx.removeLink
            initialData: $sources.detail.forms.link
            fields:
                - $type: FieldSelect
                  label: Relation
                  bind: type
                  options: $sources.detail.linkTypeOptions
                - $type: FieldText
                  label: Other task (id or prefix)
                  bind: target
            actions:
                - $type: ButtonSave
                  label: Remove link

    - $type: Section
      title: Children
      items:
          - $type: DataTable
            rows: $sources.detail.children
            navigateTo: '{href}'
            emptyMessage: No children
            columns:
                - { key: 'id', label: 'ID', mono: true }
                - { key: 'title', label: 'Title' }
                - { key: 'status', label: 'Status' }
