                                      ariaLabel: New parent
                                      placeholder: Search a task to make the parent
                                      action: setParent
                                      bodyKey: parent
                                      projectParam: $sources.detail.projectParam
                                      excludeDescendantsOf: $route.id
                                      params:
                                        id: $route.id
                                        projectParam: $sources.detail.projectParam
                                    - $type: Form
                                      $if: $sources.detail.canDetach
                                      onSubmit: $ctx.removeParent
                                      initialData: $sources.detail.forms.empty
                                      fields: []
                                      actions:
                                        - $type: ButtonAction
                                          label: Detach from its parent
                                          variant: danger-outline
                                          size: sm
                                          type: submit
                            - $type: Divider
                            - $type: task:Panel
                              title: Labels
                              appearance: plain
                              items:
                                - $type: task:LabelCombobox
                                  labels: $sources.detail.labelList
                                  labelKeys: $sources.detail.labelKeys
                                  addAction: addLabel
                                  removeAction: removeLabelChip
                                  labelParam: label
                                  projectParam: $sources.detail.projectParam
                                  placeholder: Add a label
                                  emptyText: No labels
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                            - $type: Divider
                            - $type: task:Panel
                              title: Metadata
                              appearance: plain
                              items:
                                - $type: task:MetaEditor
                                  entries: $sources.detail.metaEntries
                                  setAction: setMeta
                                  removeAction: removeMetaKey
                                  keyParam: key
                                  valueParam: value
                                  collapseAfter: 3
                                  emptyText: No metadata
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
      jira:
        label: Jira
        hint: Layout of a Jira work item, from knowledge of it (no access to the product) - id and editable summary, an action row (Add sub-task, Link, Actions), Description, Child items with a progress bar, Linked items, Activity with the composer on top, and a sticky right Details panel with the status as a prominent button.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: task:WidthFrame
              width: wide
              items:
