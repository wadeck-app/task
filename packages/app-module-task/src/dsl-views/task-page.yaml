      github-b:
        label: GitHub B
        hint: GitHub issue with sub-issues - parent chain above the title, a progress bar under it, then the description, the sub-issues list and linked tasks, with a compact sidebar for status, type, labels and parent.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: VerticalStack
                  gap: gap-2
                  items:
                    - $type: task:BreadcrumbTrail
                      $if: $sources.detail.hasAncestors
                      items: $sources.detail.ancestors
                      separator: slash
                      maxItems: 5
                      currentLabel: $sources.detail.task.id
                    - $type: PageHeader
                      title: $sources.detail.task.title
                      headerActions:
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: History
                          to: $sources.detail.taskHrefs.history
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Children
                          to: $sources.detail.taskHrefs.childrenList
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Delete
                          variant: danger-outline
                          to: $sources.detail.taskHrefs.deleteTasks
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: task:StatusBadge
                          $if: $sources.detail.isOpen
                          label: $sources.detail.task.status
                          tone: $sources.detail.statusTone
                          icon: open
                          size: md
                        - $type: task:StatusBadge
                          $if: $sources.detail.isTerminal
                          label: $sources.detail.task.status
                          tone: $sources.detail.statusTone
                          icon: done
                          size: md
                        - $type: Badge
                          label: $sources.detail.projectText
                          variant: info
                        - $type: RelativeDate
                          date: $sources.detail.updatedAt
                        - $type: Badge
                          $if: $sources.detail.blockedText
                          label: $sources.detail.blockedText
                          variant: warning
                - $type: task:VariantSwitcher
                  id: github-b-progress
                  label: Progress
                  initial: bar
                  variants:
                    bar:
                      label: Bar
                      hint: A filled bar with the sentence "2 of 5 done" under the title.
                      view:
                        $type: task:ProgressSummary
                        $if: $sources.detail.hasChildren
                        done: $sources.detail.childrenSummary.done
                        total: $sources.detail.childrenSummary.total
                        text: $sources.detail.childrenSummary.text
                        appearance: bar
                    segments:
                      label: Segments
                      hint: One block per sub-issue, filled when it is closed.
                      view:
                        $type: task:ProgressSummary
                        $if: $sources.detail.hasChildren
                        done: $sources.detail.childrenSummary.done
                        total: $sources.detail.childrenSummary.total
                        text: $sources.detail.childrenSummary.text
                        appearance: segments
                    ring:
                      label: Ring
                      hint: A circle with the percentage and the sentence beside it.
                      view:
                        $type: task:ProgressSummary
                        $if: $sources.detail.hasChildren
                        done: $sources.detail.childrenSummary.done
                        total: $sources.detail.childrenSummary.total
                        text: $sources.detail.childrenSummary.text
                        appearance: ring
                - $type: task:VariantSwitcher
                  id: github-b-sidebar
                  label: Sidebar
                  initial: right
                  variants:
                    right:
                      label: Right
                      hint: Compact sidebar on the right; metadata, parent and link forms in a closed panel under the lists.
                      view:
                        $type: task:SplitLayout
                        sidePosition: right
                        sideWidth: narrow
                        main:
                          - $type: VerticalStack
                            gap: gap-4
                            items:
                              - $type: task:Panel
                                $if: $sources.detail.hasDescription
                                title: Description
                                items:
                                  - $type: Markdown
                                    text: $sources.detail.descriptionText
                              - $type: task:VariantSwitcher
                                id: github-b-lists
                                label: Lists
                                initial: open
                                variants:
                                  open:
                                    label: Open
                                    hint: Sub-issues and linked tasks are open lists, shown only when they have rows.
                                    view:
                                      $type: VerticalStack
                                      gap: gap-4
                                      items:
                                        - $type: task:Panel
                                          $if: $sources.detail.hasChildren
                                          title: Sub-issues
                                          count: $sources.detail.childrenSummary.total
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.detail.children
                                              appearance: list
                                        - $type: task:Panel
                                          $if: $sources.links.hasLinks
                                          title: Linked
                                          count: $sources.detail.linkCount
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.links.rows
                                              appearance: list
                                  folded:
                                    label: Folded
                                    hint: Sub-issues and linked tasks start folded to a title with a count.
                                    view:
                                      $type: VerticalStack
                                      gap: gap-2
                                      items:
                                        - $type: task:Panel
                                          $if: $sources.detail.hasChildren
                                          title: Sub-issues
                                          count: $sources.detail.childrenSummary.total
                                          collapsible: true
                                          defaultOpen: false
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.detail.children
                                              appearance: list
                                        - $type: task:Panel
                                          $if: $sources.links.hasLinks
                                          title: Linked
                                          count: $sources.detail.linkCount
                                          collapsible: true
                                          defaultOpen: false
                                          items:
                                            - $type: task:TaskRowList
                                              rows: $sources.links.rows
                                              appearance: list
                              - $type: task:Panel
                                title: Metadata, parent and links
                                collapsible: true
                                defaultOpen: false
                                items:
                                  - $type: VerticalStack
                                    gap: gap-2
                                    items:
                                      - $type: task:KeyValueList
                                        $if: $sources.detail.hasMeta
                                        entries: $sources.detail.metaList
                                      - $type: VerticalStack
                                        gap: gap-2
                                        items:
                                          - $type: Badge
                                            $if: $ctx.metaResult.errorText
                                            label: $ctx.metaResult.errorText
                                            variant: danger
                                          - $type: Badge
                                            $if: $ctx.metaResult.undeliveredText
                                            label: $ctx.metaResult.undeliveredText
                                            variant: warning
                                      - $type: Form
                                        $if: $sources.detail.forms
                                        onSubmit: $ctx.setMeta
                                        initialData: $sources.detail.forms.meta
                                        fields:
                                          - $type: FieldText
                                            label: Key
                                            bind: key
                                          - $type: FieldText
                                            label: Value
                                            bind: value
                                        actions:
