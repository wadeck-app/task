                              items:
                                - $type: task:MetaEditor
                                  entries: $sources.detail.metaEntries
                                  setAction: setMeta
                                  removeAction: removeMetaKey
                                  keyParam: key
                                  valueParam: value
                                  collapseAfter: 3
                                  emptyText: No metadata
                                  params:
                                    id: $route.id
                                    projectParam: $sources.detail.projectParam
                            - $type: task:PropertyList
                              density: compact
                              labelPlacement: inline
                              labelWidth: narrow
                              items:
                                - $type: task:PropertyRow
                                  label: Created
                                  items:
                                    - $type: RelativeDate
                                      date: $sources.detail.createdAt
                                - $type: task:PropertyRow
                                  label: Updated
                                  items:
                                    - $type: RelativeDate
                                      date: $sources.detail.updatedAt
