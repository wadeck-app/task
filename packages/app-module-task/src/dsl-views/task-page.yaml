# GENERATED - edit src/dsl-views/variants/*.yaml and run: npm run views --workspace=packages/app-module-task
# (scripts/generate-task-page.mjs). The comments below come from variants/_page.yaml.
# ============================================================================================================
# TASK PAGE VARIANTS - how this page is built (read this before editing task-page.yaml: it is GENERATED)
#
# `src/dsl-views/task-page.yaml` is assembled by `npm run views --workspace=packages/app-module-task` (script:
# scripts/generate-task-page.mjs at the repository root) from the files of this folder:
#   _page.yaml     this file: the sources, the actions, the notices and the experiment (variant order).
#                  Everything up to the line `$type: PageContent` is copied verbatim (comments included).
#   _shared.yaml   named fragments, used anywhere as `{ $use: form.status }` (one node each; no other key next to $use).
#   <variant>.yaml one file per variant with exactly three keys: `label`, `hint` (shown by the switcher), `view` (ONE node).
# A test fails when task-page.yaml is stale, so run the script after every edit here.
#
# Add a variant: create <name>.yaml here and add <name> to `variants` under `$experiment` below, then run the script.
# Options of a variant: nested `task:VariantSwitcher` nodes inside its view, id `<variant>-<option>`, 2-3 choices.
# Remove a variant: take its name out of `variants`, move its file out of the folder.
# REMOVE THE EXPERIMENT (bake the winner): in this file keep $sources/$actions, replace the `task:VariantSwitcher` by the
# `view` of the chosen variant (expand its `$use`), delete the other fragments, the generator, `npm run views`,
# taskPageVariants.test.ts and the fixture, then drop the presentation fields no remaining view reads (see taskViews.ts).
#
# Conventions for the components that run actions (the installed shell, dsl-ui 175, sends NO body from onAction):
#   params: { id: $route.id, projectParam: $sources.detail.projectParam }   plus the value, which the component adds
#   quick actions (below): setStatusTo / setTypeTo / addLabelTo carry the value in the URL path; removeLabel already does.
# ============================================================================================================

# Detail of one task (/modules/task/tasks/p/:project/:id). ":id" of the manifest path is $route.id, ":project" is
# $route.project (the id of the project, resolved by GET /projects). The breadcrumb leads back: no back link here.
#
# Every form below submits through a named action ($actions) bound with `onSubmit: $ctx.<action>`:
# - the body is the form data; it also fills the {placeholders} of the action URL ({id} is the route id);
# - `projectParam` is the project already URL-encoded by the route (the substitution does not encode), so the URL is
#   always `?project={projectParam}`; the forms get it through their initialData (`$sources.detail.forms.*`);
# - the page reloads its sources after a successful action;
# - `&inlineErrors=true`: the DSL drops the answer of a failed request (nothing is shown, the form just stays as typed),
#   so the routes answer a failure as data (`errorText`, one line with the hint) and the section of the form shows it;
# - `resultKey` publishes the answer as $ctx.<key>: the error, and what the queue did not receive (`undeliveredText`),
#   are shown in the section of the form that produced them (the page is long, a message at the top would be off screen).
# FieldSelect crashes the page while its options are not loaded: every form sits behind $if on its source data.
# The sources are fed by `projectQuery` (the project, else `blank=true`): the shell keeps the last answer of a source it
# skips, so an unknown or unreadable project must replace the previous task with an empty answer, not skip the request.
# The sources that wait for `projects` also name a $urlParam (`reload`, empty in practice): the shell reloads on a URL
# change only the sources that name one, so without it a link to another project or filter changed the URL and nothing else.
$sources:
    projects:
        url: GET /api/modules/task/projects
        params:
            project: $route.project
    # inlineErrors on every source: one failing source discards the answers of all the others (the page stays blank), so a
    # failure is answered as data (`errorText`) and shown by a badge.
    # `tree` and `links` fail with the same error as `detail` when the task does not exist: `detail` shows it.
    detail:
        url: GET /api/modules/task/tasks/{id}?{query}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    tree:
        url: GET /api/modules/task/tree?{query}&id={id}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload
    links:
        url: GET /api/modules/task/tasks/{id}/links?{query}&inlineErrors=true
        params:
            id: $route.id
            query: $source.projects.projectQuery
            reload: $urlParam.reload

$actions:
    setStatus:
        url: POST /api/modules/task/tasks/{id}/status?project={projectParam}&inlineErrors=true
        resultKey: statusResult
        reloadSources: true
    setType:
        url: POST /api/modules/task/tasks/{id}/type?project={projectParam}&inlineErrors=true
        resultKey: typeResult
        reloadSources: true
    addLabel:
        url: POST /api/modules/task/tasks/{id}/labels?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true
    # {label} is the base64url key of the label picked in the select (see labelOptions).
    removeLabel:
        url: DELETE /api/modules/task/tasks/{id}/label-keys/{label}?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true
    # The chip x of task:LabelChips: removes by the base64url key of the label ({labelKey}), which any label can travel in a path.
    removeLabelChip:
        url: DELETE /api/modules/task/tasks/{id}/label-keys/{labelKey}?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true
    setMeta:
        url: POST /api/modules/task/tasks/{id}/meta?project={projectParam}&inlineErrors=true
        resultKey: metaResult
        reloadSources: true
    setParent:
        url: POST /api/modules/task/tasks/{id}/parent?project={projectParam}&inlineErrors=true
        resultKey: parentResult
        reloadSources: true
    removeParent:
        url: DELETE /api/modules/task/tasks/{id}/parent?project={projectParam}&inlineErrors=true
        resultKey: parentResult
        reloadSources: true
    addLink:
        url: POST /api/modules/task/tasks/{id}/links?project={projectParam}&inlineErrors=true
        resultKey: linkResult
        reloadSources: true
    removeLink:
        url: DELETE /api/modules/task/tasks/{id}/links?project={projectParam}&inlineErrors=true
        resultKey: linkResult
        reloadSources: true

    # Quick actions for the task: components (ActionSelect, SegmentedControl, LabelChips): the value is in the URL path,
    # because the shell's onAction sends no body. Same service calls, same answers, same resultKeys as the Form twins.
    setStatusTo:
        url: POST /api/modules/task/tasks/{id}/status/{statusEncoded}?project={projectParam}&inlineErrors=true
        resultKey: statusResult
        reloadSources: true
    setTypeTo:
        url: POST /api/modules/task/tasks/{id}/type/{typeEncoded}?project={projectParam}&inlineErrors=true
        resultKey: typeResult
        reloadSources: true
    addLabelTo:
        url: POST /api/modules/task/tasks/{id}/labels/{labelEncoded}?project={projectParam}&inlineErrors=true
        resultKey: labelResult
        reloadSources: true

$type: PageContent
sections:
  - $type: Badge
    $if: $sources.projects.noProjects
    label: $sources.projects.noProjectsText
    variant: info
  - $type: Badge
    $if: $sources.projects.selectedProblem
    label: $sources.projects.selectedProblem
    variant: danger
  - $type: Badge
    $if: $sources.projects.unknownProjectText
    label: $sources.projects.unknownProjectText
    variant: danger
  - $type: Badge
    $if: $sources.detail.errorText
    label: $sources.detail.errorText
    variant: danger
  - $type: Badge
    $if: $sources.detail.warningText
    label: $sources.detail.warningText
    variant: warning
  - $type: task:VariantSwitcher
    id: task-design
    label: Task page
    initial: current
    variants:
      current:
        label: Current
        hint: The page as shipped, a stack of sections.
        view:
          $type: VerticalStack
          gap: gap-4
          items:
            - $type: PageHeader
              title: $sources.detail.task.title
              headerActions:
                - $type: ButtonLink
                  $if: $sources.detail.taskHrefs
                  label: History
                  to: $sources.detail.taskHrefs.history
                - $type: ButtonLink
                  $if: $sources.detail.taskHrefs
                  label: Children
                  to: $sources.detail.taskHrefs.childrenList
            - $type: HorizontalStack
              gap: gap-3
              $if: $sources.detail.task
              items:
                - $type: Badge
                  label: $sources.detail.projectText
                  variant: info
                - $type: Badge
                  label: $sources.detail.task.status
                  variant: info
                - $type: Badge
                  $if: $sources.detail.task.type
                  label: $sources.detail.task.type
                  variant: info
                - $type: Badge
                  $if: $sources.detail.parent
                  label: $sources.detail.parent.title
                  variant: info
            - $type: Section
              title: Status
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.statusResult.errorText
                  label: $ctx.statusResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.statusResult.undeliveredText
                  label: $ctx.statusResult.undeliveredText
                  variant: warning
                - $type: Form
                  $if: $sources.detail.forms
                  onSubmit: $ctx.setStatus
                  initialData: $sources.detail.forms.status
                  fields:
                    - $type: FieldSelect
                      label: Status
                      bind: status
                      options: $sources.detail.statusOptions
                  actions:
                    - $type: ButtonSave
                      label: Change status
            - $type: Section
              title: Type
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.typeResult.errorText
                  label: $ctx.typeResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.typeResult.undeliveredText
                  label: $ctx.typeResult.undeliveredText
                  variant: warning
                - $type: Form
                  $if: $sources.detail.hasTypes
                  onSubmit: $ctx.setType
                  initialData: $sources.detail.forms.type
                  fields:
                    - $type: FieldSelect
                      label: Type
                      bind: type
                      options: $sources.detail.typeOptions
                      placeholder: No type
                  actions:
                    - $type: ButtonSave
                      label: Set type
                - $type: Badge
                  $if: $sources.detail.noTypes
                  label: No type is configured for this project (any text is accepted). Add some on the Types page.
                  variant: info
                - $type: Form
                  $if: $sources.detail.noTypes
                  onSubmit: $ctx.setType
                  initialData: $sources.detail.forms.type
                  fields:
                    - $type: FieldText
                      label: Type (free text)
                      bind: type
                  actions:
                    - $type: ButtonSave
                      label: Set type
            - $type: Section
              title: Labels
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.labelResult.errorText
                  label: $ctx.labelResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.labelResult.undeliveredText
                  label: $ctx.labelResult.undeliveredText
                  variant: warning
                - $type: DataTable
                  rows: $sources.detail.labelRows
                  emptyMessage: No labels
                  columns:
                    - key: label
                      label: Label
                - $type: Form
                  $if: $sources.detail.forms
                  onSubmit: $ctx.addLabel
                  initialData: $sources.detail.forms.label
                  fields:
                    - $type: FieldText
                      label: New label
                      bind: label
                  actions:
                    - $type: ButtonSave
                      label: Add label
                - $type: Form
                  $if: $sources.detail.hasLabels
                  onSubmit: $ctx.removeLabel
                  initialData: $sources.detail.forms.label
                  fields:
                    - $type: FieldSelect
                      label: Label to remove
                      bind: label
                      options: $sources.detail.labelOptions
                      placeholder: Choose a label
                  actions:
                    - $type: ButtonSave
                      label: Remove label
            - $type: Section
              title: Metadata
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.metaResult.errorText
                  label: $ctx.metaResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.metaResult.undeliveredText
                  label: $ctx.metaResult.undeliveredText
                  variant: warning
                - $type: DataTable
                  rows: $sources.detail.metaRows
                  emptyMessage: No metadata
                  columns:
                    - key: key
                      label: Key
                      mono: true
                    - key: value
                      label: Value
                - $type: Form
                  $if: $sources.detail.forms
                  onSubmit: $ctx.setMeta
                  initialData: $sources.detail.forms.meta
                  fields:
                    - $type: FieldText
                      label: Key
                      bind: key
                    - $type: FieldText
                      label: Value
                      bind: value
                  actions:
                    - $type: ButtonSave
                      label: Set metadata
            - $type: Section
              title: Hierarchy
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.parentResult.errorText
                  label: $ctx.parentResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.parentResult.undeliveredText
                  label: $ctx.parentResult.undeliveredText
                  variant: warning
                - $type: DataTable
                  rows: $sources.tree.rows
                  navigateTo: '{href}'
                  emptyMessage: No hierarchy
                  columns:
                    - key: label
                      label: Task
                    - key: id
                      label: ID
                      mono: true
                      nowrap: true
                    - key: status
                      label: Status
                      nowrap: true
                - $type: Form
                  $if: $sources.detail.forms
                  onSubmit: $ctx.setParent
                  initialData: $sources.detail.forms.parent
                  fields:
                    - $type: FieldText
                      label: New parent (task id or prefix)
                      bind: parent
                  actions:
                    - $type: ButtonSave
                      label: Set parent
                - $type: Form
                  $if: $sources.detail.canDetach
                  onSubmit: $ctx.removeParent
                  initialData: $sources.detail.forms.empty
                  fields: []
                  actions:
                    - $type: ButtonAction
                      label: Detach from its parent
                      variant: secondary
                      type: submit
            - $type: Section
              title: Links
              $if: $sources.detail.task
              items:
                - $type: Badge
                  $if: $ctx.linkResult.errorText
                  label: $ctx.linkResult.errorText
                  variant: danger
                - $type: Badge
                  $if: $ctx.linkResult.undeliveredText
                  label: $ctx.linkResult.undeliveredText
                  variant: warning
                - $type: DataTable
                  rows: $sources.links.rows
                  navigateTo: '{href}'
                  emptyMessage: No links
                  columns:
                    - key: relation
                      label: Relation
                    - key: direction
                      label: Direction
                    - key: id
                      label: Task
                      mono: true
                      nowrap: true
                    - key: titleText
                      label: Title
                      truncate: true
                      title: '{title}'
                    - key: status
                      label: Status
                      nowrap: true
                - $type: Form
                  $if: $sources.detail.linkTypeOptions
                  onSubmit: $ctx.addLink
                  initialData: $sources.detail.forms.link
                  fields:
                    - $type: FieldSelect
                      label: Relation
                      bind: type
                      options: $sources.detail.linkTypeOptions
                    - $type: FieldText
                      label: Other task (id or prefix)
                      bind: target
                  actions:
                    - $type: ButtonSave
                      label: Add link
                - $type: Form
                  $if: $sources.detail.linkTypeOptions
                  onSubmit: $ctx.removeLink
                  initialData: $sources.detail.forms.link
                  fields:
                    - $type: FieldSelect
                      label: Relation
                      bind: type
                      options: $sources.detail.linkTypeOptions
                    - $type: FieldText
                      label: Other task (id or prefix)
                      bind: target
                  actions:
                    - $type: ButtonSave
                      label: Remove link
            - $type: Section
              title: Children
              $if: $sources.detail.task
              items:
                - $type: DataTable
                  rows: $sources.detail.children
                  navigateTo: '{href}'
                  emptyMessage: No children
                  columns:
                    - key: id
                      label: ID
                      mono: true
                      nowrap: true
                    - key: titleText
                      label: Title
                      truncate: true
                      title: '{title}'
                    - key: status
                      label: Status
                      nowrap: true
      github-a:
        label: GitHub A
        hint: GitHub issue page - title, status badge and age, description first, sub-issues with progress, linked tasks and activity in the main column, a sidebar of properties where status, type and labels change on click (no Save button).
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: VerticalStack
                  gap: gap-2
                  items:
                    - $type: task:BreadcrumbTrail
                      $if: $sources.detail.hasAncestors
                      items: $sources.detail.ancestors
                      separator: slash
                      maxItems: 4
                      currentLabel: $sources.detail.task.id
                    - $type: PageHeader
                      title: $sources.detail.task.title
                      headerActions:
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: History
                          to: $sources.detail.taskHrefs.history
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Children
                          to: $sources.detail.taskHrefs.childrenList
                        - $type: ButtonLink
                          $if: $sources.detail.taskHrefs
                          label: Delete
                          variant: danger-outline
                          to: $sources.detail.taskHrefs.deleteTasks
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: task:StatusBadge
                          $if: $sources.detail.isOpen
                          label: $sources.detail.task.status
                          tone: $sources.detail.statusTone
                          icon: open
                          size: md
                        - $type: task:StatusBadge
                          $if: $sources.detail.isTerminal
                          label: $sources.detail.task.status
                          tone: $sources.detail.statusTone
                          icon: done
                          size: md
                        - $type: Badge
                          label: $sources.detail.projectText
                          variant: info
                        - $type: RelativeDate
                          date: $sources.detail.createdAt
                        - $type: Badge
                          $if: $sources.detail.blockedText
                          label: $sources.detail.blockedText
                          variant: warning
                - $type: task:VariantSwitcher
                  id: github-a-layout
                  label: Sidebar
                  initial: right
                  variants:
                    right:
                      label: Right
                      hint: Properties sidebar on the right of the description, as GitHub does; stacks below 1024 px.
                      view:
                        $type: task:SplitLayout
                        sidePosition: right
                        main:
                          - $type: VerticalStack
                            gap: gap-4
                            items:
                              - $type: task:Panel
                                $if: $sources.detail.hasDescription
                                title: Description
                                items:
                                  - $type: Markdown
                                    text: $sources.detail.descriptionText
                              - $type: task:Panel
                                $if: $sources.detail.hasChildren
                                title: Sub-issues
                                count: $sources.detail.childrenSummary.total
                                items:
                                  - $type: task:ProgressSummary
                                    done: $sources.detail.childrenSummary.done
                                    total: $sources.detail.childrenSummary.total
                                    text: $sources.detail.childrenSummary.text
                                    appearance: bar
                                  - $type: task:TaskRowList
                                    rows: $sources.detail.children
                                    appearance: list
                              - $type: task:Panel
                                $if: $sources.links.hasLinks
                                title: Linked tasks
                                items:
                                  - $type: task:TaskRowList
                                    rows: $sources.links.rows
                                    appearance: list
                              - $type: task:VariantSwitcher
                                id: github-a-activity
                                label: Activity
                                initial: timeline
                                variants:
                                  timeline:
                                    label: Timeline
                                    hint: Created and status changes as a dated timeline under the description, like the activity of a GitHub issue.
                                    view:
                                      $type: task:Panel
                                      title: Activity
                                      items:
                                        - $type: task:Timeline
                                          $if: $sources.detail.hasActivity
                                          entries: $sources.detail.activity
                                          groupByDay: true
                                          order: oldest-first
                                  hidden:
                                    label: Hidden
                                    hint: No activity block; the page stops after the related tasks.
                                    view:
                                      $type: VerticalStack
                                      items: []
                              - $type: task:VariantSwitcher
                                id: github-a-forms
                                label: Other fields
                                initial: inline
                                variants:
                                  inline:
                                    label: Inline
                                    hint: Metadata, parent and links forms are open panels under the activity.
                                    view:
                                      $type: VerticalStack
                                      gap: gap-4
                                      items:
                                        - $type: task:Panel
                                          title: Set metadata
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-2
                                              items:
                                                - $type: VerticalStack
                                                  gap: gap-2
                                                  items:
                                                    - $type: Badge
                                                      $if: $ctx.metaResult.errorText
                                                      label: $ctx.metaResult.errorText
                                                      variant: danger
                                                    - $type: Badge
                                                      $if: $ctx.metaResult.undeliveredText
                                                      label: $ctx.metaResult.undeliveredText
                                                      variant: warning
                                                - $type: Form
                                                  $if: $sources.detail.forms
                                                  onSubmit: $ctx.setMeta
                                                  initialData: $sources.detail.forms.meta
                                                  fields:
                                                    - $type: FieldText
                                                      label: Key
                                                      bind: key
                                                    - $type: FieldText
                                                      label: Value
                                                      bind: value
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Set metadata
                                        - $type: task:Panel
                                          title: Set parent
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-2
                                              items:
                                                - $type: Form
                                                  $if: $sources.detail.forms
                                                  onSubmit: $ctx.setParent
                                                  initialData: $sources.detail.forms.parent
                                                  fields:
                                                    - $type: FieldText
                                                      label: New parent (task id or prefix)
                                                      bind: parent
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Set parent
                                        - $type: task:Panel
                                          title: Links
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-2
                                              items:
                                                - $type: VerticalStack
                                                  gap: gap-2
                                                  items:
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.errorText
                                                      label: $ctx.linkResult.errorText
                                                      variant: danger
                                                    - $type: Badge
                                                      $if: $ctx.linkResult.undeliveredText
                                                      label: $ctx.linkResult.undeliveredText
                                                      variant: warning
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.addLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Add link
                                                - $type: Form
                                                  $if: $sources.detail.linkTypeOptions
                                                  onSubmit: $ctx.removeLink
                                                  initialData: $sources.detail.forms.link
                                                  fields:
                                                    - $type: FieldSelect
                                                      label: Relation
                                                      bind: type
                                                      options: $sources.detail.linkTypeOptions
                                                    - $type: FieldText
                                                      label: Other task (id or prefix)
                                                      bind: target
                                                  actions:
                                                    - $type: ButtonSave
                                                      label: Remove link
                                  collapsed:
                                    label: Collapsed
                                    hint: The same three forms folded in one closed panel, so the page shows only what is read often.
                                    view:
                                      $type: task:Panel
                                      title: Edit metadata, parent and links
                                      collapsible: true
                                      defaultOpen: false
                                      items:
                                        - $type: VerticalStack
                                          gap: gap-2
                                          items:
                                            - $type: VerticalStack
                                              gap: gap-2
                                              items:
                                                - $type: Badge
                                                  $if: $ctx.metaResult.errorText
                                                  label: $ctx.metaResult.errorText
                                                  variant: danger
                                                - $type: Badge
                                                  $if: $ctx.metaResult.undeliveredText
                                                  label: $ctx.metaResult.undeliveredText
                                                  variant: warning
                                            - $type: Form
                                              $if: $sources.detail.forms
                                              onSubmit: $ctx.setMeta
                                              initialData: $sources.detail.forms.meta
                                              fields:
                                                - $type: FieldText
                                                  label: Key
                                                  bind: key
                                                - $type: FieldText
