      jira-b:
        label: Jira B
        hint: Jira workflow bar - one click per status right under the title (current one highlighted), blocked warning next to it, then description, child and linked issues, with a narrow Details panel (type, labels, parent, more fields).
        view:
          $type: VerticalStack
          $if: $sources.detail.task
          gap: gap-0
          items:
            - $type: VerticalStack
              gap: gap-4
              items:
                - $type: task:BreadcrumbTrail
                  $if: $sources.detail.hasAncestors
                  items: $sources.detail.ancestors
                  separator: chevron
                  maxItems: 4
                  currentLabel: $sources.detail.task.id
                - $type: PageHeader
                  title: $sources.detail.task.title
                  headerActions:
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: History
                      to: $sources.detail.taskHrefs.history
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: Children
                      to: $sources.detail.taskHrefs.childrenList
                    - $type: ButtonLink
                      $if: $sources.detail.taskHrefs
                      label: Delete
                      variant: danger-outline
                      to: $sources.detail.taskHrefs.deleteTasks
                - $type: HorizontalStack
                  justify: justify-start
                  align: items-start
                  items:
                    - $type: task:VariantSwitcher
                      id: jira-b-transitions
                      label: Transitions
                      initial: segmented
                      variants:
                        segmented:
                          label: Segmented
                          hint: All statuses side by side in one segmented bar; the current status is filled.
                          view:
                            $type: VerticalStack
                            gap: gap-1
                            items:
                              - $type: task:SegmentedControl
                                $if: $sources.detail.forms
                                appearance: segmented
                                size: md
                                ariaLabel: Move the task to a status
                                options: $sources.detail.statusChoices
                                value: $sources.detail.task.status
                                action: setStatusTo
                                valueParam: status
                                params:
                                  id: $route.id
                                  projectParam: $sources.detail.projectParam
                              - $type: VerticalStack
                                gap: gap-2
                                items:
                                  - $type: Badge
                                    $if: $ctx.statusResult.errorText
                                    label: $ctx.statusResult.errorText
                                    variant: danger
                                  - $type: Badge
                                    $if: $ctx.statusResult.undeliveredText
                                    label: $ctx.statusResult.undeliveredText
                                    variant: warning
                        pills:
                          label: Pills
                          hint: The same statuses as separate rounded buttons, closer to the Jira transition buttons.
                          view:
                            $type: VerticalStack
                            gap: gap-1
                            items:
                              - $type: task:SegmentedControl
                                $if: $sources.detail.forms
                                appearance: pills
                                size: md
                                ariaLabel: Move the task to a status
                                options: $sources.detail.statusChoices
                                value: $sources.detail.task.status
                                action: setStatusTo
                                valueParam: status
                                params:
                                  id: $route.id
