      linear-a:
        label: Linear A
        hint: Linear issue - big title, one row of property chips (status, type, labels, parent) that change on click, description full width, sub-issues with progress, relations and activity below; no sidebar.
        view:
          $type: VerticalStack
          $if: $sources.detail.task
