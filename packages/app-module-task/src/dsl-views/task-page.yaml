                                          - $type: Form
                                            $if: $sources.detail.linkTypeOptions
                                            onSubmit: $ctx.removeLink
                                            initialData: $sources.detail.forms.link
                                            fields:
                                              - $type: FieldSelect
                                                label: Relation
