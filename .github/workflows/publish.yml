name: Publish @wadeck-app/task-cli

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        outputs:
            dist_tag: ${{ steps.version.outputs.dist_tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Check app-module layout and manifest
              run: npm run check --workspace=packages/app-module-task

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash packages/task-cli/ci/scripts/generate-platform-packages.sh task:app-module/
              env:
                  PLATFORMS: win32-x64,darwin-arm64

            - name: Copy artifacts to platform packages
              run: bash packages/task-cli/ci/scripts/copy-binaries.sh

            - name: Set version in all packages
              run: |
                  for pkg in task-cli-dist task-cli-win32-x64 task-cli-darwin-arm64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: task-cli-packages
                  path: packages/task-cli-*
                  retention-days: 1

    # Real macOS verification of the PACKED packages (nothing published, throwaway npm prefix): `task --version`,
    # `task cli version`, `task --help` must print the version / something and exit 0, with and without the platform
    # package.
    # Informative until the macOS runner is confirmed to start; then gate publish on it again. Two consecutive runs
    # ended `cancelled` on this job (cause unknown: runner availability, billing or label) and, because publish waited
    # for it, nothing was published. It runs in parallel with publish and never blocks it.
    # Apple silicon only (the owner does not support Intel Macs): macos-latest is arm64 and gets a runner in the project repo (macos-14 was cancelled twice here; check
    # against the GitHub docs if the job never starts).
    macos-smoke:
        needs: build-and-test
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: task-cli-packages
                  path: packages

            - name: Restore exec bits lost by the artifact transfer
              run: bash packages/task-cli/ci/scripts/restore-exec-bits.sh packages task win32-x64,darwin-arm64

            - name: Smoke test the packed CLI
              run: bash packages/task-cli/ci/scripts/smoke-packed.sh packages task "${{ needs.build-and-test.outputs.version }}" win32-x64,darwin-arm64

    publish:
        needs: build-and-test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: task-cli-packages
                  path: packages

            # upload/download-artifact drop file modes: without this the published launcher is 0644 (EACCES on macOS).
            - name: Restore exec bits lost by the artifact transfer
              run: bash packages/task-cli/ci/scripts/restore-exec-bits.sh packages task win32-x64,darwin-arm64

            - name: Publish platform packages
              run: |
                  for pkg in task-cli-win32-x64 task-cli-darwin-arm64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package
              working-directory: packages/task-cli-dist
              run: npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
